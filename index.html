<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>도미니언 웹앱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#241708;--parch:#f3e7c9;--gold:#e6b93e;--cw:128px;--sw:84px;--felt:#1f4a2c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'Nanum Myeongjo',serif;color:var(--parch);
  background-color:#3a2313;
  background-image:
    repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 2px,transparent 2px 120px),
    repeating-linear-gradient(90deg,rgba(255,220,170,.035) 0 1px,transparent 1px 7px),
    repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 3px,transparent 3px 23px),
    linear-gradient(180deg,#5b3820,#3a2313 45%,#2a180b);
  background-attachment:fixed}
button{font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;border-radius:6px;padding:9px 16px;
  border:2px solid #4a2f12;background:linear-gradient(#fbeec8,#dcc186);color:#3a230c;box-shadow:0 3px 0 #4a2f12,inset 0 1px 0 #fff8e0}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #4a2f12}
button:disabled{opacity:.45;cursor:default;transform:none}
button.red{background:linear-gradient(#d9826a,#9c3a22);color:#fff;border-color:#5a1a0a;box-shadow:0 3px 0 #5a1a0a}
button.green{background:linear-gradient(#f3d36b,#c9951e);color:#3a2300;border-color:#6d4a0a;box-shadow:0 3px 0 #6d4a0a,inset 0 1px 0 #fff4c0}
button.sm{font-size:13px;padding:6px 11px}
input,select{font-family:inherit;font-size:15px;padding:8px 10px;border-radius:6px;border:2px solid #8c6a37;background:#fffaf0;color:#2a1a0e}
h1.logo{font-family:'Cinzel',serif;font-weight:900;letter-spacing:6px;text-align:center;font-size:clamp(40px,10vw,84px);margin:26px 0 0;
  background:linear-gradient(#fff6cf,#f0c64a 45%,#a8740f 55%,#f3cf6a);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #2a1406) drop-shadow(0 0 18px rgba(0,0,0,.7))}
.sub{text-align:center;opacity:.9;margin:2px 0 18px;letter-spacing:3px;font-weight:700}
.hero{display:flex;justify-content:center;margin:10px 0 34px;height:calc(var(--cw)*1.65)}
.hero>div{margin:0 calc(var(--cw)*-.18);transform-origin:50% 140%}
.panel{max-width:900px;margin:0 auto 18px;padding:18px 20px;border-radius:6px;color:var(--ink);
  background:radial-gradient(ellipse at 30% 20%,#fbf3dc,#ecdcb3 70%,#dcc592);border:1px solid #6b4a1f;
  box-shadow:0 0 0 4px #2a1a0c,0 0 0 6px #b8903f,0 10px 30px rgba(0,0,0,.6)}
.panel h2{margin:0 0 12px;font-size:19px;border-bottom:2px solid #b89556;padding-bottom:6px;font-weight:800}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.center{text-align:center}
.foot{text-align:center;color:var(--parch);opacity:.75;font-size:12px;padding:14px;letter-spacing:1px}
.wrap{padding:0 14px}
.bigbtn{padding:16px 26px;font-size:18px;line-height:1.3}

/* ================= 카드 ================= */
.card{--w:var(--cw);width:var(--w);height:calc(var(--w)*1.55);border-radius:calc(var(--w)*.065);flex:none;position:relative;
  background:#120c06;padding:calc(var(--w)*.032);color:var(--ink);font-size:calc(var(--w)*.1);line-height:1.15;
  box-shadow:0 3px 8px rgba(0,0,0,.6);user-select:none;-webkit-user-select:none}
.card.s{--w:var(--sw)}
.card.big{--w:min(270px,72vw)}
.card.xs{--w:30px}
.frame{height:100%;border-radius:calc(var(--w)*.04);display:grid;grid-template-rows:15% 40% 1fr 11%;padding:0 5.5%;
  background:var(--fr);box-shadow:inset 0 0 calc(var(--w)*.05) rgba(0,0,0,.35)}
.t-action{--fr:radial-gradient(ellipse at 50% 30%,#f2ede2,#d6ccb4 80%,#c2b594)}
.t-treasure{--fr:radial-gradient(ellipse at 50% 30%,#fbe38c,#d9a42a 75%,#a8740f)}
.t-victory{--fr:radial-gradient(ellipse at 50% 30%,#d2eca8,#86b554 75%,#5a8a30)}
.t-curse{--fr:radial-gradient(ellipse at 50% 30%,#dcc4ef,#9468b8 75%,#633a86)}
.t-reaction{--fr:linear-gradient(#ebe5d6 0 50%,#a9cdee 50%,#5d93c9)}
.t-av{--fr:linear-gradient(#ebe5d6 0 50%,#b6d98c 50%,#6e9d3e)}
.t-tv{--fr:linear-gradient(#f7dc7a 0 50%,#b6d98c 50%,#6e9d3e)}
.t-duration{--fr:radial-gradient(ellipse at 50% 30%,#fcdcb0,#eb9d4c 72%,#b9621b)}
.t-dur-react{--fr:linear-gradient(#f7c996 0 50%,#a9cdee 50%,#5d93c9)}
.t-at{--fr:linear-gradient(#ebe5d6 0 50%,#f7dc7a 50%,#d9a42a)}
.pile .bane{position:absolute;top:18%;left:-6px;z-index:2;background:#6a2a8a;color:#fff;font:800 10px/1 sans-serif;padding:3px 5px;border-radius:4px;border:1px solid #2a0a3a}
.offsup{display:flex;flex-direction:column;gap:10px;align-items:center;align-self:center}
.offrow{display:flex;flex-wrap:wrap;gap:12px 10px;justify-content:center;align-items:flex-start;margin-top:14px;padding-top:10px;border-top:1px dashed rgba(243,231,201,.3)}
.offrow .pile .lbl2{max-width:var(--sw);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.offlbl{width:100%;text-align:center;font-size:12px;font-weight:800;opacity:.8}
.offsup .lbl2{font-size:11px;font-weight:800;text-align:center;margin-top:3px}
.cof{display:inline-flex;gap:6px;align-items:center}
.t-night{--fr:radial-gradient(ellipse at 50% 30%,#5c5f7a,#2b2c40 72%,#12121e)}
.t-night-dur{--fr:linear-gradient(#3a3b52 0 50%,#eb9d4c 50%,#b9621b)}
.t-an{--fr:linear-gradient(#ebe5d6 0 50%,#34354a 50%,#12121e)}
.t-night .ty,.t-an .ty{color:#f3ead8}
.bnrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.bn-tile{width:calc(var(--sw)*1.3);min-height:calc(var(--sw)*.8);border-radius:6px;padding:5px 6px;font-size:10px;line-height:1.25;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.5);color:#241708}
.bn-tile b{display:block;font-size:12px;margin-bottom:2px}
.bn-tile.boon{background:radial-gradient(ellipse at 50% 30%,#fffbe0,#f0d77a 80%,#c9a53a)}
.bn-tile.hex{background:radial-gradient(ellipse at 50% 30%,#d8c8f0,#8a6ab8 80%,#4a2a78);color:#fff}
.bn-tile.state{background:radial-gradient(ellipse at 50% 30%,#f4f0e8,#c8bca8 80%,#8a7a60)}
.t-reserve{--fr:radial-gradient(ellipse at 50% 30%,#f0e0b8,#c8a468 72%,#9a7a3a)}
.t-tr-res{--fr:linear-gradient(#f7dc7a 0 50%,#d8bc80 50%,#b08a48)}
.t-vic-res{--fr:linear-gradient(#d8bc80 0 50%,#b6d98c 50%,#6e9d3e)}
.t-trav{--fr:radial-gradient(ellipse at 50% 30%,#f4f0e8,#d8d0c0 72%,#b8ae98)}
.ev{width:calc(var(--sw)*1.62);height:var(--sw);border-radius:6px;background:#120c06;padding:3px;flex:none;cursor:pointer;position:relative;box-shadow:0 3px 8px rgba(0,0,0,.6)}
.ev.big{width:min(420px,90vw);height:min(260px,56vw)}
.ev .fr{height:100%;border-radius:4px;background:radial-gradient(ellipse at 50% 30%,#eef0f2,#c0c8d0 75%,#98a2ae);display:grid;grid-template-rows:auto 1fr;padding:4px 6px;color:#241708}
.ev .en{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:12px;gap:4px}
.ev .en .coin{width:20px;height:20px;font-size:11px}
.ev .et{font-size:9px;line-height:1.25;overflow:hidden;background:rgba(255,255,255,.55);border-radius:3px;padding:2px 4px;margin-top:2px}
.ev.big .en{font-size:20px}.ev.big .en .coin{width:34px;height:34px;font-size:18px}.ev.big .et{font-size:15px;padding:8px}
.ev.can{outline:3px solid #ffe07a;box-shadow:0 0 14px 4px rgba(255,224,122,.7)}
.ev.off{opacity:.45}.ev.pick.on{outline:3px solid #b8573c}
.debt{display:inline-grid;place-items:center;flex:none;width:1.5em;height:1.5em;font-weight:900;line-height:1;font-family:'Cinzel',serif;color:#fff;background:linear-gradient(#a8744a,#6a3e22);clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%)}
.ft .debt{font-size:.95em}.ev .en .debt{width:20px;height:20px;font-size:11px}.ev.big .en .debt{width:34px;height:34px;font-size:18px}
.ev .ec{display:flex;gap:3px;align-items:center}.ev .lmk{font-size:9px;font-weight:800;color:#3a5a2a;letter-spacing:.05em}.ev .lmv{font:800 11px/1 sans-serif;color:#fff;background:#2e6b3a;border-radius:8px;padding:3px 6px}
.ev.big .lmk{font-size:14px}.ev.big .lmv{font-size:16px}
.ev.proj .fr{background:radial-gradient(ellipse at 50% 30%,#fbe8e0,#e8b0a0 75%,#c07860)}
.ev .own{display:flex;gap:3px;flex-wrap:wrap;margin-top:2px}.ev .own i{font-style:normal;font:800 9px/1 sans-serif;color:#fff;background:#6a2a2a;border-radius:6px;padding:2px 4px}
.bn-tile.ally{background:radial-gradient(ellipse at 50% 30%,#f0e8ff,#c0a8e0 80%,#7a5aa8)}
.bn-tile.art{background:radial-gradient(ellipse at 50% 30%,#f4f0e8,#d8c8a0 80%,#a08a58)}
.ev.way .fr{background:radial-gradient(ellipse at 50% 30%,#e8f4f8,#a8cfe0 75%,#6a9ab8)}
.ev.trait .fr{background:radial-gradient(ellipse at 50% 30%,#f4ecd8,#d8c08a 75%,#a88a4a)}
.pile .trt{position:absolute;left:50%;transform:translateX(-50%);top:-8px;z-index:3;font:800 9px/1 sans-serif;color:#fff;background:#8a6a2a;border:1px solid #3a2a0a;border-radius:8px;padding:2px 5px;white-space:nowrap}
.ev.proph .fr{background:radial-gradient(ellipse at 50% 30%,#fff4e0,#f0c080 75%,#c07830)}
.ev.proph.on .fr{box-shadow:inset 0 0 0 3px #ff8a2a}
.shadowrow{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;margin:-4px 0 8px;font-size:12px}
.ev.lm .fr{background:radial-gradient(ellipse at 50% 30%,#eef5e6,#bfd0ae 75%,#93a884)}
.pile .pvp,.pile .pdebt{position:absolute;right:-6px;z-index:3;font:800 10px/1 sans-serif;color:#fff;padding:3px 5px;border-radius:8px;border:1px solid rgba(0,0,0,.5);white-space:nowrap}
.pile .pvp{top:22%;background:#2e6b3a}.pile .pdebt{top:40%;background:#8a5a3a}
.evrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.tokb{position:absolute;left:-6px;z-index:3;font:800 9px/1 sans-serif;color:#fff;padding:2px 4px;border-radius:8px;border:1px solid rgba(0,0,0,.5);white-space:nowrap}
.t-ruins{--fr:radial-gradient(ellipse at 50% 30%,#d8b88a,#9a7048 72%,#6a4a2a)}
.t-shelter{--fr:radial-gradient(ellipse at 50% 30%,#f0b8a8,#c8705a 72%,#8a3a2a)}
.t-sh-react{--fr:linear-gradient(#e8a090 0 50%,#a9cdee 50%,#5d93c9)}
.t-sh-act{--fr:linear-gradient(#ebe5d6 0 50%,#e8a090 50%,#c8705a)}
.t-sh-vic{--fr:linear-gradient(#c5e0a0 0 50%,#e8a090 50%,#c8705a)}
.t-vr{--fr:linear-gradient(#c5e0a0 0 50%,#a9cdee 50%,#5d93c9)}
.t-tr-react{--fr:linear-gradient(#f7dc7a 0 50%,#a9cdee 50%,#5d93c9)}
.t-dur-treasure{--fr:linear-gradient(#f7dc7a 0 50%,#f2b36e 50%,#c56f25)}
.mats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:-4px 0 6px}
.mat{background:rgba(0,0,0,.28);border:1px solid rgba(243,231,201,.25);border-radius:8px;padding:5px 8px 7px}
.mat .lbl{font-size:12px;font-weight:800;opacity:.85;margin-bottom:4px}
.mat .cs{display:flex;gap:4px;flex-wrap:wrap}
.seat .mi{font-size:11px;color:#f3c77a;margin-top:2px}
.seat .durs{display:flex;gap:3px;margin-left:4px}
.seat{cursor:pointer}
.tx.duo{flex-direction:row;gap:12%}
.shield.vp-s{font-size:.72em;margin-top:.15em}
.opts{display:flex;flex-direction:column;gap:8px;margin:10px auto;max-width:360px}
.opts button.on{background:linear-gradient(#f3d36b,#c9951e)}
.kset{margin-bottom:12px}.ksh{font-weight:900;margin:4px 0 6px}.ksh small{font-weight:700;color:#6b2c0c;margin-left:6px}
.chk{display:inline-flex;align-items:center;gap:4px;font-weight:700}
.pile .disc{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);z-index:2;font:800 11px/1 sans-serif;color:#fff;background:#2a6f3a;border:2px solid #0f3018;border-radius:9px;padding:2px 6px;white-space:nowrap}
input[type=range]{width:100%;accent-color:#b8903f}
.nm{align-self:end;background:linear-gradient(#fffdf6,#efe3c4);border:1px solid #6b5436;border-radius:calc(var(--w)*.035);
  text-align:center;font-weight:800;padding:4% 2% 3%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1.02em;
  box-shadow:0 calc(var(--w)*.008) 0 rgba(0,0,0,.25)}
.nm small{display:none;font-family:'Cinzel',serif;font-size:.5em;letter-spacing:1px;opacity:.65;margin-top:1px}
.card.big .nm small{display:block}
.art{margin:4% 0 3%;border:calc(var(--w)*.014) solid #2e2010;border-radius:1px;position:relative;overflow:hidden;
  box-shadow:inset 0 0 calc(var(--w)*.09) rgba(0,0,0,.55)}
.art::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,rgba(255,255,255,.22),transparent 60%);pointer-events:none}
.art .ico{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);font-size:calc(var(--w)*.36);line-height:1;
  filter:drop-shadow(0 calc(var(--w)*.025) calc(var(--w)*.02) rgba(0,0,0,.55))}
.art .coins{position:absolute;inset:0;display:grid;place-items:center}
.art .coins .coin{position:absolute;width:calc(var(--w)*.3);height:calc(var(--w)*.3);font-size:calc(var(--w)*.13)}
.tx{background:linear-gradient(#fdf9ee,#f1e7cd);border:1px solid rgba(90,70,40,.55);border-radius:calc(var(--w)*.03);
  display:flex;flex-direction:column;justify-content:safe center;align-items:center;text-align:center;padding:3% 5%;overflow:hidden;min-height:0;margin-bottom:3%}
.tx.tv{background:transparent;border:0}
.tx .bn{font-weight:900;font-size:1em;line-height:1.2;white-space:nowrap}
.tx .p{font-size:.6em;line-height:1.3;margin-top:.25em}
.tx.long .p{font-size:.5em;line-height:1.22}.tx.long .bn{font-size:.85em;line-height:1.1}.card.big .tx.long .p{font-size:.52em}
.card.big .frame{grid-template-rows:12% 31% 1fr 10%}
.card.big .tx .bn{font-size:.9em}
.tx hr{width:85%;border:0;border-top:1px solid #6b5436;margin:.3em 0}
.tx .sm{font-size:.72em;font-weight:900;line-height:1.2}
.card:not(.big) .tx .bn{font-size:.95em}
.ft{display:flex;align-items:center;gap:4%;padding-bottom:4%}
.ft .coin{width:1.5em;height:1.5em;font-size:.95em}
.ft .ty{flex:1;text-align:center;font-weight:800;font-size:.58em;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ft .gap{width:1.5em}
.coin{display:inline-grid;place-items:center;border-radius:50%;font-weight:900;flex:none;line-height:1;font-family:'Cinzel',serif;
  background:radial-gradient(circle at 35% 30%,#fff7c8,#e8ba3c 50%,#9b700f);color:#3a2600;border:1px solid #5d420a;
  box-shadow:inset 0 0 0 .1em rgba(255,240,170,.5),0 .06em .12em rgba(0,0,0,.5)}
.coin.cu{background:radial-gradient(circle at 35% 30%,#ffd8b4,#c8783a 50%,#7a3c12);color:#3b1a05;border-color:#4e240a}
.coin.ag{background:radial-gradient(circle at 35% 30%,#ffffff,#c9ccd3 50%,#7a7f89);color:#23262c;border-color:#4a4d55}
.coin.pt{background:radial-gradient(circle at 35% 30%,#ffffff,#b9d4e6 45%,#5f7f99);color:#10263a;border-color:#2c4658}
.vpt{display:inline-block;background:#2f5a1f;color:#fff;border:1px solid #173010;border-radius:9px;padding:0 6px;font-size:11px;font-weight:800;margin-left:4px}
.bigcoin{width:2.1em;height:2.1em;font-size:1.25em}
.shield{width:2em;height:2.25em;display:grid;place-items:center;font-family:'Cinzel',serif;font-weight:900;font-size:1.05em;color:#fff;padding-bottom:.25em;
  background:linear-gradient(#6fa13c,#2e5412);clip-path:polygon(0 0,100% 0,100% 58%,50% 100%,0 58%);text-shadow:0 1px 2px #000}
.shield.neg{background:linear-gradient(#8a55b5,#3b1760)}
.back{background:#120c06}
.back .frame{background:radial-gradient(circle at 50% 50%,#8a2b1d,#5a160c 70%,#3a0c05);display:grid;place-items:center;grid-template-rows:1fr;
  box-shadow:inset 0 0 0 calc(var(--w)*.04) #c99a3a,inset 0 0 0 calc(var(--w)*.055) #3a0c05,inset 0 0 0 calc(var(--w)*.07) #c99a3a}
.back .frame::after{content:'♛';color:#e6b93e;font-size:calc(var(--w)*.42);text-shadow:0 2px 0 #2a0803}
.slot{border:2px dashed rgba(243,231,201,.35);background:rgba(0,0,0,.2);box-shadow:none;padding:0}

/* ================= 게임 테이블 ================= */
.game{display:grid;grid-template-columns:1fr 250px;gap:12px;padding:10px;min-height:100vh}
.main{display:flex;flex-direction:column;gap:10px;min-width:0}
.side{display:flex;flex-direction:column;position:sticky;top:10px;height:calc(100vh - 20px)}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo2{font-family:'Cinzel',serif;font-weight:900;font-size:24px;letter-spacing:3px;
  background:linear-gradient(#fff6cf,#f0c64a 50%,#a8740f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #1a0c03)}
.topbar .info{font-size:13px;opacity:.85}
.topbar .sp{flex:1}
.opps{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.seat{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:6px;
  background:linear-gradient(#4a2e18,#2e1b0c);border:1px solid #1a0e05;box-shadow:inset 0 1px 0 rgba(255,220,160,.15),0 3px 8px rgba(0,0,0,.5)}
.seat.cur{box-shadow:0 0 0 2px var(--gold),0 0 18px rgba(230,185,62,.55)}
.seat .nmp{font-weight:800;font-size:15px}
.seat .st{font-size:12px;opacity:.85}
.minis{display:flex}
.minis .card{margin-left:-20px}.minis .card:first-child{margin-left:0}
.felt{position:relative;border-radius:10px;padding:16px 14px;
  background:radial-gradient(ellipse at 50% 40%,#2f6b40,var(--felt) 70%,#133019);
  box-shadow:0 0 0 3px #b8903f,0 0 0 9px #3e2410,0 0 0 10px #1c0f05,0 10px 28px rgba(0,0,0,.6),inset 0 0 40px rgba(0,0,0,.55)}
.felt::before{content:'';position:absolute;inset:0;border-radius:10px;opacity:.12;pointer-events:none;
  background-image:repeating-radial-gradient(circle at 20% 30%,#000 0 1px,transparent 1px 3px)}
.supply{display:flex;gap:18px;justify-content:center;align-items:flex-start;flex-wrap:wrap;position:relative}
.base{display:grid;grid-template-rows:repeat(3,auto);grid-auto-flow:column;gap:8px 8px}
.kingdom{display:grid;grid-template-columns:repeat(5,auto);gap:10px 10px}
.pile{position:relative;cursor:pointer;transition:transform .12s}
.pile .card{box-shadow:1.5px 1.5px 0 #0c0804,3px 3px 0 #3b2b18,4.5px 4.5px 0 #0c0804,0 6px 12px rgba(0,0,0,.55)}
.pile.low .card{box-shadow:1.5px 1.5px 0 #0c0804,0 4px 10px rgba(0,0,0,.55)}
.pile .cnt{position:absolute;top:-8px;right:-8px;z-index:2;min-width:26px;height:26px;padding:0 5px;border-radius:13px;display:grid;place-items:center;
  font:800 12px/1 sans-serif;color:#2a1a00;background:radial-gradient(circle at 35% 30%,#fff7c8,#e8ba3c 55%,#9b700f);border:2px solid #3a2600}
.pile.empty .card{filter:grayscale(1) brightness(.45);box-shadow:none}
.pile.empty .cnt{background:#555;color:#fff;border-color:#222}

.tokens{display:flex;gap:10px}

.tok b{display:block;font-size:22px;font-family:'Cinzel',serif;line-height:1}
.tok.gold{background:radial-gradient(circle at 35% 30%,#fff7c8,#e8ba3c 55%,#9b700f)}

.hc.can{cursor:pointer}

.mbox{color:var(--ink);border-radius:6px;padding:18px;max-width:780px;width:100%;max-height:92vh;overflow:auto;text-align:center;

.mbox h3{margin:0 0 10px;font-size:19px}
.mcards{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.pass{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:#2a180b}
.pass .mbox{max-width:420px}
table.res{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px}
table.res th,table.res td{border-bottom:1px solid #b89556;padding:6px 4px}
table.res tr.win{background:rgba(230,185,62,.35);font-weight:800}
.kbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.kgrid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px;border-radius:6px;background:radial-gradient(ellipse,#2f6b40,#1a3f24);box-shadow:inset 0 0 20px rgba(0,0,0,.5)}
.kpick{cursor:pointer;opacity:.4;transition:.12s;filter:saturate(.5)}
.kpick.on{opacity:1;filter:none;transform:translateY(-3px)}
.kpick.on .card{outline:3px solid #ffe07a;outline-offset:1px}
.plist .row{background:rgba(255,255,255,.45);padding:6px 8px;border-radius:6px;margin:4px 0}
.code{font-family:'Cinzel',serif;font-size:42px;letter-spacing:10px;color:#6b2c0c;text-align:center}
.mobile-log,.mobile-trash{display:none}
@media (max-width:980px){
  :root{--cw:96px;--sw:66px}
  .game{grid-template-columns:1fr;padding:6px}
  .side{display:none}
  .mobile-log{display:inline-block}
  .supply{gap:10px}.kingdom{gap:8px}
}
@media (max-width:560px){
  :root{--cw:74px;--sw:56px}
  .base{grid-template-rows:none;grid-template-columns:repeat(4,auto);grid-auto-flow:row;gap:8px}
  .kingdom{gap:7px}
  .hand .tx .p{display:none}
  .turnplate{min-width:0;flex:1 1 100%}
  .inplay{flex:1 1 100%}
  .tok{width:50px;height:50px}.tok b{font-size:18px}
  .felt{padding:12px 6px}
  .me .stack .card{--w:var(--sw)}
  .trashslot{display:none}
  .mobile-trash{display:inline-block}
  .inplay{min-height:calc(var(--sw)*1.55 + 30px)}
}
</style>

  if(c==='Farmland'&&io&&p.hand.length){

  // 수집품: 이번 턴에 행동 카드를 획득하면 수집품 1장당 승점 토큰 1개
  if(s===S.cur&&S.collection>0&&isAction(c)){p.vp+=S.collection;log(S,`${p.name}: 수집품 — 승점 토큰 +${S.collection}`);}
  let loc=to;
  loc=await empGain(S,s,c,loc,entry);

  // 무역상: 손에서 공개해 획득한 카드를 은화로 교환

  if(io&&c==='Berserker'&&(s===S.cur?S.play.some(isAction):p.durCards.some(isAction))&&takeGained(S,s,c,loc,entry)){loc='played';await playReact(S,io,s,c);}
  if(io&&c==='Trail'&&loc!=='gone'&&loc!=='trash'&&await yesno(S,io,s,{title:'오솔길: 획득한 이 카드를 바로 사용할까요?',card:'Trail',purpose:'reactPlay'})&&takeGained(S,s,c,loc,entry)){loc='played';await playReact(S,io,s,c);}

     await yesno(S,io,s,{title:`선원: 획득한 「${nm(c)}」을(를) 바로 사용할까요?`,card:c,purpose:'sailor'})&&takeGained(S,s,c,loc,entry)){
    S.sailor--;S.play.push(c);await playCard(S,io,s,c);}
  // 바보의 금: 다른 플레이어가 속주를 획득하면, 손의 바보의 금을 폐기하고 금화를 덱 위로
  if(c==='Province'&&io)for(let k=1;k<n;k++){const t=(s+k)%n,q=S.players[t];
    while(q.hand.includes("Fool's Gold")&&await yesno(S,io,t,{title:`${p.name}님이 속주를 획득했습니다. 바보의 금을 폐기하고 금화를 덱 위에 획득할까요?`,card:"Fool's Gold",purpose:'fgReact'})){
      q.hand.splice(q.hand.indexOf("Fool's Gold"),1);await toTrash(S,t,["Fool's Gold"]);log(S,`${q.name}: 바보의 금 폐기`);await gain(S,t,'Gold','deck');}}
  // 복제: 선술집 매트에서 호출해 같은 카드 획득 (비용 $6 이하)
  while(io&&p.tavern&&p.tavern.includes('Duplicate')&&costS(S,c)<=6&&S.supply[pileKey(c)]>0&&topOf(S,pileKey(c))===c&&
     await yesno(S,io,s,{title:`복제: 「${nm(c)}」을(를) 한 장 더 획득할까요?`,card:c,purpose:'duplicate'})){callReserve(S,s,'Duplicate');await gain(S,s,c);}
  // 해적: 누구든 보물을 획득하면 손의 해적을 사용할 수 있음
  if(isTreasure(c)&&io)for(let k=0;k<n;k++){const t=(S.cur+k)%n,q=S.players[t];
    while(q.hand.includes('Pirate')&&await yesno(S,io,t,{title:`${S.players[s].name}님이 보물 「${nm(c)}」을(를) 획득했습니다. 손의 해적을 사용할까요?`,card:'Pirate',purpose:'pirate'})){
      q.hand.splice(q.hand.indexOf('Pirate'),1);
      if(t===S.cur){S.play.push('Pirate');await resolve(S,io,t,'Pirate',newRef(S,'Pirate'));}
      else{log(S,`${q.name}: ▶ 해적 사용 (반응)`);q.durCards.push('Pirate');q.durEff.push({card:'Pirate',key:'Pirate',data:null});}}}
}
function addVP(S,s,k,why){if(!(k>0))return;const p=S.players[s];p.vp=(p.vp||0)+k;log(S,`${p.name}: ${why} — 승점 토큰 +${k}`);}
function takeLM(S,s,e,k){if(!LM(S,e))return;const have=S.lmVP[e]||0,n=k==null?have:Math.min(k,have);if(n<=0)return;S.lmVP[e]=have-n;addVP(S,s,n,EVENTS[e].ko);}
/* ---- 야상곡: 축복·흉조 받기 ---- */
function takeBoon(S){if(!S.boonDeck)return null;if(!S.boonDeck.length){S.boonDeck=shuffle(S.boonDisc||[]);S.boonDisc=[];}return S.boonDeck.pop()||null;}
function doneBoon(S,b){if(!b)return;if(KEEP_BOONS.includes(b))S.boonKept.push(b);else S.boonDisc.push(b);}
async function boon(S,io,s){const b=takeBoon(S);if(!b){log(S,'받을 축복이 없음');return null;}await receiveBoon(S,io,s,b);doneBoon(S,b);return b;}
async function receiveBoon(S,io,s,b){const p=S.players[s];log(S,`${p.name}: ✨ 축복 「${BOONS[b].ko}」`);
  switch(b){
    case "The Earth's Gift":{if(!p.hand.some(isTreasure))break;const [i]=await chooseCards(S,io,s,{min:0,max:1,filter:isTreasure,title:'대지의 선물: 보물 1장을 버리면 비용 $4 이하의 카드를 획득합니다 (선택)',purpose:'earth'});
      if(i===undefined)break;const x=p.hand.splice(i,1)[0];log(S,`${p.name}: ${nm(x)} 버림`);await toDiscard(S,p,[x]);
      const g=await chooseSupply(S,io,s,{max:4,title:'대지의 선물: 비용 $4 이하의 카드를 획득하세요'});if(g)await gain(S,s,g);break;}
    case "The Field's Gift":plus(S,s,{actions:1,coins:1});break;
    case "The Flame's Gift":{if(!p.hand.length)break;const [i]=await chooseCards(S,io,s,{min:0,max:1,title:'불꽃의 선물: 폐기할 카드를 고르세요 (선택)',purpose:'flame'});
      if(i!==undefined){const x=p.hand.splice(i,1)[0];log(S,`${p.name}: ${nm(x)} 폐기`);await toTrash(S,s,[x]);}break;}
    case "The Forest's Gift":plus(S,s,{buys:1,coins:1});break;
    case "The Moon's Gift":{if(!p.discard.length)break;const [i]=await chooseCards(S,io,s,{src:'list',list:p.discard,min:0,max:1,title:'달의 선물: 덱 위에 놓을 카드를 버린 카드 더미에서 고르세요 (선택)',purpose:'moon'});
      if(i!==undefined){p.deck.push(p.discard.splice(i,1)[0]);log(S,`${p.name}: 버린 카드 1장을 덱 위에`);}break;}
    case "The Mountain's Gift":await gain(S,s,'Silver');break;
    case "The River's Gift":S.riverDraw[s]=(S.riverDraw[s]||0)+1;log(S,`${p.name}: 이번 턴이 끝날 때 +1 카드`);break;
    case "The Sea's Gift":plus(S,s,{cards:1});break;
    case "The Sky's Gift":if(p.hand.length>=3&&await yesno(S,io,s,{title:'하늘의 선물: 카드 3장을 버리고 금화를 획득할까요?',card:'Gold',purpose:'sky'})){
      await discardN(S,io,s,3,'하늘의 선물: 버릴 카드 3장을 고르세요');await gain(S,s,'Gold');}break;
    case "The Sun's Gift":{const look=[];for(let j=0;j<4;j++){const c=topCard(p);if(c!=null)look.push(c);}const base=S.aside.length;S.aside.push(...look);
      const d=look.length?await chooseCards(S,io,s,{src:'list',list:look,min:0,max:look.length,title:'태양의 선물: 버릴 카드를 고르세요 (나머지는 덱 위로)',purpose:'sunDiscard'}):[];
      const cs=d.map(i=>look[i]);const rest=look.filter((_,i)=>!d.includes(i));S.aside.splice(base,look.length);S.aside.push(...rest);
      if(cs.length){await toDiscard(S,p,cs);log(S,`${p.name}: ${summ(cs)} 버림`);}
      await orderSeg(S,io,s,base,rest.length,'태양의 선물');break;}
    case "The Swamp's Gift":await gainNS(S,s,"Will-o'-Wisp");break;
    case "The Wind's Gift":plus(S,s,{cards:2});await discardN(S,io,s,2,'바람의 선물: 버릴 카드 2장을 고르세요');break;
  }}
async function orderSeg(S,io,s,base,n,label){ // S.aside[base..base+n)의 카드를 원하는 순서로 덱 위에 (고르는 동안에도 카드가 사라지지 않게)
  const p=S.players[s];let k=0;
  while(n-k>0){const seg=S.aside.slice(base,base+n-k);let i=0;
    if(new Set(seg).size>1)[i]=await chooseCards(S,io,s,{src:'list',list:seg,min:1,max:1,title:`${label}: 덱 위에 되돌릴 순서 — ${k+1}번째(위쪽부터) 카드`,purpose:'order'});
    p.deck.push(S.aside.splice(base+i,1)[0]);k++;}
  const t=p.deck.splice(p.deck.length-k,k).reverse();p.deck.push(...t);}
function takeHex(S){if(!S.hexDeck)return null;if(!S.hexDeck.length){S.hexDeck=shuffle(S.hexDisc||[]);S.hexDisc=[];}return S.hexDeck.pop()||null;}
async function hexTo(S,io,ts){if(!ts.length)return;const h=takeHex(S);if(!h)return;log(S,`🌑 흉조 「${HEXES[h].ko}」`);
  for(const t of ts)await receiveHex(S,io,t,h);S.hexDisc.push(h);}
async function receiveHex(S,io,t,h){const q=S.players[t];
  switch(h){
    case 'Bad Omens':{q.discard.push(...q.deck);q.deck=[];let k=0;for(let j=0;j<2;j++){const i=q.discard.lastIndexOf('Copper');if(i<0)break;q.discard.splice(i,1);q.deck.push('Copper');k++;}
      log(S,`${q.name}: 덱을 버리고 동화 ${k}장을 덱 위에${k<2?' (버린 카드 공개)':''}`);break;}
    case 'Delusion':if(!q.deluded&&!q.envious){q.deluded=true;log(S,`${q.name}: 「현혹됨」을 가져옴`);}break;
    case 'Envy':if(!q.deluded&&!q.envious){q.envious=true;log(S,`${q.name}: 「질투함」을 가져옴`);}break;
    case 'Famine':{const rev=[];for(let j=0;j<3;j++){const c=topCard(q);if(c!=null)rev.push(c);}const a=rev.filter(isAction),r=rev.filter(c=>!isAction(c));
      q.deck.push(...r);shuffle(q.deck);log(S,`${q.name}: 덱 위 공개 — ${summ(rev)||'없음'}`);if(a.length)await toDiscard(S,q,a);break;}
    case 'Fear':{if(q.hand.length<5)break;const f=c=>isAction(c)||isTreasure(c);if(!q.hand.some(f)){log(S,`${q.name}: 손패 공개 — 행동·보물 없음`);break;}
      const [i]=await chooseCards(S,io,t,{min:1,max:1,filter:f,title:'공포: 버릴 행동이나 보물 카드를 고르세요',purpose:'discard'});const x=q.hand.splice(i,1)[0];log(S,`${q.name}: ${nm(x)} 버림`);await toDiscard(S,q,[x]);break;}
    case 'Greed':await gain(S,t,'Copper','deck');break;
    case 'Haunting':{if(q.hand.length<4)break;const [i]=await chooseCards(S,io,t,{min:1,max:1,title:'원혼: 덱 위에 놓을 카드를 고르세요',purpose:'haunting'});q.deck.push(q.hand.splice(i,1)[0]);log(S,`${q.name}: 카드 1장을 덱 위에`);break;}
    case 'Locusts':{const c=topCard(q);if(c==null)break;log(S,`${q.name}: 덱 맨 위 ${nm(c)} 폐기`);await toTrash(S,t,[c]);
      if(c==='Copper'||c==='Estate'){if(!await gain(S,t,'Curse'))log(S,'저주 카드가 남아 있지 않음');}
      else{const ty=CARDS[c].types;const g=await chooseSupply(S,io,t,{max:99,filter:x=>costLT(S,x,c)&&CARDS[x].types.some(y=>ty.includes(y)),title:`메뚜기 떼: ${nm(c)}보다 싸고 종류가 겹치는 카드를 획득하세요`,purpose:'locusts'});if(g)await gain(S,t,g);}break;}
    case 'Misery':q.misery=q.misery?2:1;log(S,`${q.name}: 「${q.misery===2?'두 배로 비참함':'비참함'}」`);break;
    case 'Plague':if(!await gain(S,t,'Curse','hand'))log(S,'저주 카드가 남아 있지 않음');break;
    case 'Poverty':await discardDownTo(S,io,[t],3,'가난');break;
    case 'War':{const rev=[];let hit=null;while(true){const c=topCard(q);if(c==null)break;const v=costS(S,c);if((v===3||v===4)&&!dOf(S,c)){hit=c;break;}rev.push(c);}
      log(S,`${q.name}: 공개 — ${summ(rev)||'없음'}${hit?` / ${nm(hit)} 폐기`:''}`);const base=S.aside.length;S.aside.push(...rev);
      if(hit)await toTrash(S,t,[hit]);const r=S.aside.splice(base,rev.length);if(r.length)await toDiscard(S,q,r);break;}
  }}
async function nocGain(S,s,c,loc,entry){ // 야상곡: 획득할 때
  const p=S.players[s],io=IO;
  if(c==='Skulk')await gain(S,s,'Gold');
  if(c==='Cursed Village'&&io)await hexTo(S,io,[s]);
  if(c==='Cemetery'&&io&&p.hand.length){const d=await chooseCards(S,io,s,{min:0,max:4,title:'묘지: 손에서 카드를 4장까지 폐기할 수 있습니다',purpose:'chapel'});
    if(d.length){const cs=removeIdx(p.hand,d);log(S,`${p.name}: ${summ(cs)} 폐기`);await toTrash(S,s,cs);}}
  if(c==='Blessed Village'&&io){const b=takeBoon(S);if(b){
    const [o]=await chooseOptions(S,io,s,{title:`축복받은 마을: 축복 「${BOONS[b].ko}」 — ${BOONS[b].text}`,options:['지금 받기','다음 턴 시작 시 받기'],min:1,max:1,purpose:'bvillage'});
    if(o===0){await receiveBoon(S,io,s,b);doneBoon(S,b);}else{p.durEff.push({card:'Blessed Village',key:'BoonLater',data:b});log(S,`${p.name}: 축복을 다음 턴에 받음`);}}}
  if(io&&S.changeling&&c!=='Changeling'&&costS(S,c)>=3&&S.supply.Changeling>0&&!['gone','trash','played'].includes(loc)&&(S.supply[pileKey(c)]!=null||(S.ns&&S.ns[c]!=null))&&
     await yesno(S,io,s,{title:`뒤바뀐 아이: 획득한 「${nm(c)}」을(를) 뒤바뀐 아이와 교환할까요?`,card:'Changeling',purpose:'changeling'})&&takeGained(S,s,c,loc,entry)){

function later(S,ref,key,data){ref.stay=true;(ref.eff=ref.eff||[]).push({key,data:data==null?null:data});} // 다음 턴 시작 시 효과 예약
function takeAside(S,s,id){const p=S.players[s];const i=p.mats.aside.findIndex(e=>e.id===id);if(i<0)return;
  const e=p.mats.aside.splice(i,1)[0];p.hand.push(e.card);log(S,`${p.name}: 따로 둔 카드를 손으로 가져옴`);}
function removeIdx(arr,idxs){const out=[];[...idxs].sort((a,b)=>b-a).forEach(i=>out.unshift(arr.splice(i,1)[0]));return out;}
const emptyPiles=S=>Object.values(S.supply).filter(v=>v===0).length;
const allCards=p=>[...p.deck,...p.hand,...p.discard,...(p.exile||[]),...(p.durCards||[]),...(p.tavern||[]),...(p.perm||[]),...(p.mats?[...p.mats.native,...p.mats.island,...p.mats.aside.map(e=>e.card)]:[])];
function vpOf(p,S){const cards=allCards(p);const castles=cards.filter(c=>hasT(c,'Castle')).length;const duchies=cards.filter(c=>c==='Duchy').length,golds=cards.filter(c=>c==='Gold').length,silvers=cards.filter(c=>c==='Silver').length,kinds=new Set(cards).size;let v=0;
  cards.forEach(c=>{if(c==='Gardens')v+=Math.floor(cards.length/10);else if(c==='Duke')v+=duchies;else if(c==='Demesne')v+=golds;else if(c==='Fairgrounds')v+=2*Math.floor(kinds/5);else if(c==='Feodum')v+=Math.floor(silvers/3);else if(c==='Distant Lands')v+=0;else if(c==='Humble Castle')v+=castles;else if(c==='Pasture')v+=cards.filter(x=>x==='Estate').length;else if(c==='Territory')v+=new Set(cards.filter(isVictory)).size;else if(c==="King's Castle")v+=2*castles;else v+=CARDS[c].vp||0;});
  return v+(p.vp||0)-2*(p.misery||0)+4*(p.tavern||[]).filter(c=>c==='Distant Lands').length+(S?lmScore(S,p,cards):0);} // 머나먼 땅: 선술집 매트에 있을 때만 4점
function lmScore(S,p,cards){let v=0;
  if(S.ally==='Plateau Shepherds')v+=2*Math.min(p.favors||0,cards.filter(c=>CARDS[c].cost===2&&!CARDS[c].debt).length);const cnt={};cards.forEach(c=>cnt[c]=(cnt[c]||0)+1);const k=c=>cnt[c]||0;
  if(LM(S,'Bandit Fort'))v-=2*(k('Silver')+k('Gold'));
  if(LM(S,'Fountain')&&k('Copper')>=10)v+=15;
  if(LM(S,'Keep'))for(const c of Object.keys(cnt).filter(isTreasure))if(S.players.every(q=>q===p||allCards(q).filter(x=>x===c).length<=cnt[c]))v+=5;
  if(LM(S,'Museum'))v+=2*Object.keys(cnt).length;
  if(LM(S,'Obelisk')&&S.obelisk)v+=2*cards.filter(c=>pileKey(c)===S.obelisk).length;
  if(LM(S,'Orchard'))v+=4*Object.keys(cnt).filter(c=>isAction(c)&&cnt[c]>=3).length;
  if(LM(S,'Palace'))v+=3*Math.min(k('Copper'),k('Silver'),k('Gold'));
  if(LM(S,'Tower'))v+=cards.filter(c=>!isVictory(c)&&S.supply[pileKey(c)]===0).length;
  if(LM(S,'Triumphal Arch')){const a=Object.keys(cnt).filter(isAction).map(c=>cnt[c]).sort((x,y)=>y-x);v+=3*(a[1]||0);}
  if(LM(S,'Wall'))v-=Math.max(0,cards.length-15);
  if(LM(S,'Wolf Den'))v-=3*Object.keys(cnt).filter(c=>cnt[c]===1).length;
  return v;}

/* ---- 선택 요청 (사람/컴퓨터/원격 공통) ---- */
async function chooseCards(S,io,seat,o){
  const p=S.players[seat];const src=o.src||'hand';const pool=src==='hand'?p.hand:o.list;
  const eligible=pool.map((c,i)=>(!o.filter||o.filter(c))?i:-1).filter(i=>i>=0);
  let max=Math.min(o.max==null?99:o.max,eligible.length),min=Math.min(o.min||0,max);
  if(max===0)return [];
  if(min===eligible.length)return eligible.slice();
  if(min===max&&new Set(eligible.map(i=>pool[i])).size===1)return eligible.slice(0,min);
  const req={type:'cards',src,list:src==='list'?pool.slice():null,eligible,min,max,title:o.title,purpose:o.purpose||''};
  let a=await io.ask(seat,req);
  const ok=Array.isArray(a)&&new Set(a).size===a.length&&a.length>=min&&a.length<=max&&a.every(i=>eligible.includes(i));
  if(!ok)a=botCards(S,seat,req);
  return a;
}
async function chooseSupply(S,io,seat,o){
  const dm=o.dmax!=null?o.dmax:o.max>=99?99:0; // 빚 비용: 따로 정하지 않으면 빚 비용이 있는 카드는 '$X 이하'에 들지 않음
  const opts=Object.keys(S.supply).filter(c=>S.supply[c]>0&&(o.exact!=null?costS(S,c)===o.exact&&dOf(S,c)===(o.dexact||0):costS(S,c)<=o.max&&dOf(S,c)<=dm)&&(!o.filter||o.filter(topOf(S,c))));
  if(!opts.length){log(S,`${S.players[seat].name}: 획득할 수 있는 카드가 없음`);return null;}
  if(opts.length===1)return opts[0];
  const req={type:'supply',options:opts,max:o.max,title:o.title,purpose:o.purpose||'gain'};
  let a=await io.ask(seat,req);
  if(!opts.includes(a))a=botSupply(S,seat,req);
  return a;
}
async function yesno(S,io,seat,o){return !!(await io.ask(seat,{type:'yesno',title:o.title,card:o.card,purpose:o.purpose||''}));}
async function chooseOptions(S,io,seat,o){const n=o.options.length,min=Math.min(o.min,n),max=Math.min(o.max+(o.extra&&S.elder&&seat===S.cur?1:0),n);
  const req={type:'options',options:o.options,keys:o.keys||null,min,max,title:o.title,purpose:o.purpose||'',card:o.card||null};
  let a=await io.ask(seat,req);
  const ok=Array.isArray(a)&&new Set(a).size===a.length&&a.length>=min&&a.length<=max&&a.every(i=>Number.isInteger(i)&&i>=0&&i<n);
  if(!ok)a=botOptions(S,seat,req);return a;}
async function chooseNumber(S,io,seat,o){const req={type:'number',min:o.min,max:o.max,title:o.title,purpose:o.purpose||'',card:o.card||null,high:o.high==null?null:o.high};
  let a=await io.ask(seat,req);if(!Number.isInteger(a)||a<o.min||a>o.max)a=botNumber(S,seat,req);return a;}
async function chooseName(S,io,seat,o){const req={type:'supply',options:Object.keys(S.supply),title:o.title,purpose:o.purpose||'name'};
  let a=await io.ask(seat,req);if(!req.options.includes(a))a=botSupply(S,seat,req);return a;}
async function orderOntoDeck(S,io,s,cards,label){ // cards는 S.aside (공개 중인 카드); 맨 위부터 순서대로 고름
  const p=S.players[s],pool=cards.slice(),order=[];
  while(pool.length){if(new Set(pool).size===1){order.push(...pool.splice(0));break;}
    const [i]=await chooseCards(S,io,s,{src:'list',list:pool,min:1,max:1,title:`${label}: 덱 위에 되돌릴 순서 — ${order.length+1}번째(위쪽부터) 카드`,purpose:'order'});
    order.push(pool.splice(i,1)[0]);}
  cards.length=0;for(let k=order.length-1;k>=0;k--)p.deck.push(order[k]);}

async function attackTargets(S,io,s,card){
  const out=[],n=S.players.length;
  for(let k=1;k<n;k++){const t=(s+k)%n,p=S.players[t];
    while(p.hand.includes('Beggar')&&await yesno(S,io,t,{title:`${S.players[s].name}님이 공격 카드 「${nm(card)}」을(를) 사용했습니다. 거지를 버리고 은화 2장(1장은 덱 위)을 획득할까요?`,card:'Beggar',purpose:'beggar'})){
      p.hand.splice(p.hand.indexOf('Beggar'),1);await toDiscard(S,p,['Beggar']);await gain(S,t,'Silver','deck');await gain(S,t,'Silver');}
    while(p.hand.includes('Guard Dog')&&await yesno(S,io,t,{title:`${S.players[s].name}님이 공격 카드 「${nm(card)}」을(를) 사용했습니다. 먼저 경비견을 사용할까요?`,card:'Guard Dog',purpose:'guardDog'})){
      p.hand.splice(p.hand.indexOf('Guard Dog'),1);await playReact(S,io,t,'Guard Dog');}
    while(p.hand.includes('Diplomat')&&p.hand.length>=5&&await yesno(S,io,t,{title:`${S.players[s].name}님이 공격 카드 「${nm(card)}」을(를) 사용했습니다. 외교관을 공개해 2장 뽑고 3장 버릴까요?`,card:'Diplomat',purpose:'diplomat'})){
      drawN(p,2);const d=await chooseCards(S,io,t,{min:3,max:3,title:'외교관: 버릴 카드 3장을 고르세요',purpose:'discard'});
      const cs=removeIdx(p.hand,d);await toDiscard(S,p,cs);log(S,`${p.name}: 외교관 공개 — 2장 뽑고 ${cs.length}장 버림`);}
    while(p.hand.includes('Caravan Guard')&&await yesno(S,io,t,{title:`${S.players[s].name}님이 공격 카드 「${nm(card)}」을(를) 사용했습니다. 대상 호위를 사용할까요?`,card:'Caravan Guard',purpose:'cguard'})){
      p.hand.splice(p.hand.indexOf('Caravan Guard'),1);await playReact(S,io,t,'Caravan Guard');}
    if(p.durCards.includes('Lighthouse')){log(S,`${p.name}: 등대가 공격을 막음`);continue;}
    if(p.durCards.includes('Guardian')){log(S,`${p.name}: 수호자가 공격을 막음`);continue;}
    if(p.hand.includes('Shield')&&await yesno(S,io,t,{title:`${S.players[s].name}님이 공격 카드 「${nm(card)}」을(를) 사용했습니다. 방패를 공개해 막을까요?`,card:'Shield',purpose:'moat'})){log(S,`${p.name}: 방패를 공개해 공격을 막음`);continue;}
    if(p.champion>0){log(S,`${p.name}: 용사가 공격을 막음`);continue;}
    if(p.hand.includes('Moat')&&await yesno(S,io,t,{title:`${S.players[s].name}님이 공격 카드 「${nm(card)}」을(를) 사용했습니다. 해자를 공개해 막을까요?`,card:'Moat',purpose:'moat'})){
      log(S,`${p.name}: 해자를 공개해 공격을 막음`);continue;}
    out.push(t);}
  return out;
}
function addC(S,k){if(k>0){const p=S.players[S.cur];if(p&&p.minusCoin){p.minusCoin=false;k--;}}S.coins+=k;} // −$1 토큰
function plus(S,s,o){if(S.cham>0&&s===S.cur)o={...o,cards:o.coins||0,coins:o.cards||0}; // 카멜레온의 방식: +카드 ↔ +$
  if(o.cards)drawN(S.players[s],o.cards);if(s!==S.cur)return; // 다른 사람 턴에 반응으로 쓴 카드는 행동/구매/코인 무효
  if(o.actions&&!S.snowy)S.actions+=o.actions;if(o.buys)S.buys+=o.buys;if(o.coins)addC(S,o.coins);}

  Carnival:async(S,io,s)=>{const p=S.players[s];const rev=S.aside=[];for(let k=0;k<4;k++){const c=topCard(p);if(c!=null)rev.push(c);}

  Ferryman:async(S,io,s)=>{plus(S,s,{cards:2,actions:1});await discardN(S,io,s,1,'뱃사공: 버릴 카드 1장을 고르세요');},
  'Hunting Party':async(S,io,s)=>{plus(S,s,{cards:1,actions:1});const p=S.players[s];log(S,`${p.name}: 손패 공개 (${summ(p.hand)||'없음'})`);

  Joust:async(S,io,s)=>{plus(S,s,{cards:1,actions:1,coins:1});const p=S.players[s];

async function playNewAction(S,io,s,label){const p=S.players[s];const f=c=>isAction(c)&&!S.play.includes(c);if(!p.hand.some(f))return false; // 사용 중인 카드와 같은 카드가 없는 행동 카드 사용
  const [i]=await chooseCards(S,io,s,{min:0,max:1,filter:f,title:`${label}: 사용 중인 카드와 같은 카드가 없는 행동 카드를 사용할 수 있습니다 (선택)`,purpose:'play'});
  if(i===undefined)return false;const c=p.hand.splice(i,1)[0];S.play.push(c);await resolve(S,io,s,c,newRef(S,c));return true;}
function addDebt(S,s,k){const p=S.players[s];p.debt=(p.debt||0)+k;log(S,`${p.name}: 빚 토큰 +${k} (보유 ${p.debt})`);}

  const x=p.hand.splice(i,1)[0];const v=costS(S,x)+2,dv=dOf(S,x);log(S,`${p.name}: ${nm(x)} 폐기`);await toTrash(S,s,[x]);const g=await chooseSupply(S,io,s,{max:v,dmax:dv,title:`확대: 비용 $${v} 이하의 카드를 획득하세요`});if(g)await gain(S,s,g);}
async function spellScroll(S,io,s,ref){const p=S.players[s];const c='Spell Scroll';if(ref.gone||!S.play.includes(c))return;S.play.splice(S.play.lastIndexOf(c),1);ref.gone=true;log(S,`${p.name}: 주문 두루마리 폐기`);await toTrash(S,s,[c]);
  const g=await chooseSupply(S,io,s,{max:6,filter:x=>costLT(S,x,c),title:'주문 두루마리: 더 싼 카드를 획득하세요'});if(!g)return;const x=topOf(S,g);await gain(S,s,g);
  if((isAction(x)||isTreasure(x))&&p.discard[p.discard.length-1]===x&&await yesno(S,io,s,{title:`주문 두루마리: 획득한 「${nm(x)}」을(를) 사용할까요?`,card:x,purpose:'scroll'})){p.discard.pop();S.play.push(x);await playCard(S,io,s,x);}}
async function archiveTake(S,io,s,g,label='기록 보관소'){const p=S.players[s];const es=p.mats.aside.filter(e=>e.grp===g);if(!es.length)return false;
  const [i]=await chooseCards(S,io,s,{src:'list',list:es.map(e=>e.card),min:1,max:1,title:`${label}: 손으로 가져올 카드를 고르세요`,purpose:'archive'});
  const e=es[i];p.mats.aside.splice(p.mats.aside.indexOf(e),1);p.hand.push(e.card);log(S,`${p.name}: ${label}에서 1장을 손으로`);return es.length>1;}
async function crownAct(S,io,s,cr){const p=S.players[s];
  const [i]=await chooseCards(S,io,s,{min:0,max:1,filter:isAction,title:'왕관: 두 번 사용할 행동 카드를 고르세요 (선택)',purpose:'play'});
  if(i===undefined)return;const c=p.hand.splice(i,1)[0];S.play.push(c);const ref=newRef(S,c);
  await resolve(S,io,s,c,ref);await resolve(S,io,s,c,ref);
  if(ref.stay&&!ref.gone)cr.stay=true;if(ref.perm&&!ref.gone)cr.perm=true;}
async function crownTr(S,io,s,cr){const p=S.players[s];
  const [i]=await chooseCards(S,io,s,{min:0,max:1,filter:isTreasure,title:'왕관: 두 번 사용할 보물을 고르세요 (선택)',purpose:'tiaraPlay'});
  if(i===undefined)return;const c=p.hand.splice(i,1)[0];S.play.push(c);const r2=newRef(S,c);
  for(let k=0;k<2;k++){log(S,`${p.name}: ${nm(c)} 냄`);await playTreasure(S,io,c,r2);}
  if(r2.stay&&!r2.gone)cr.stay=true;}
function enchanted(S,s){if(s!==S.cur)return false;S.actPlays=(S.actPlays||0)+1; // 요술사: 이번 턴 처음 사용하는 행동 카드
  return S.actPlays===1&&S.lasting.some(l=>l.type==='enchant'&&l.owner!==s&&l.targets.includes(s));}


async function amuletFx(S,io,s){const p=S.players[s];
  const [o]=await chooseOptions(S,io,s,{title:'부적: 하나를 고르세요',options:['+$1','손의 카드 1장 폐기','은화 획득'],min:1,max:1,purpose:'amulet'});
  if(o===0)plus(S,s,{coins:1});else if(o===1){if(p.hand.length){const [i]=await chooseCards(S,io,s,{min:1,max:1,title:'부적: 폐기할 카드를 고르세요',purpose:'remodel'});
    const x=p.hand.splice(i,1)[0];log(S,`${p.name}: ${nm(x)} 폐기`);await toTrash(S,s,[x]);}}else await gain(S,s,'Silver');}
function myTokPiles(p){return Object.values(p.tok||{}).filter(Boolean);}
async function moveToken(S,io,s,kind,label){const p=S.players[s];
  const g=await chooseSupply(S,io,s,{max:99,filter:isAction,title:`${label}: 토큰을 놓을 행동 카드 더미를 고르세요`,purpose:'tokenPile'});
  if(g){p.tok[kind]=g;log(S,`${p.name}: ${label} 토큰 → ${nm(g)} 더미`);}}
async function buyEvent(S,io,s,ev){const p=S.players[s],E_=EVENTS[ev];
  const once=['Alms','Borrow','Save','Mission','Pilgrimage','Desperation','Launch','Journey','Continue'];
  if(ev==='Seize the Day'&&p.seized)return false;
  if(E_.proj&&hasProj(p,ev))return false;
  if(!S.events.includes(ev)||(S.buys<1&&!(PROPH(S,'Flourishing Trade')&&S.actions>0))||S.coins<E_.cost||p.debt>0||(once.includes(ev)&&S.evUsed.includes(ev))||(ev==='Inheritance'&&p.inherit))return false;
  S.phase='buy';S.coins-=E_.cost;if(S.buys>0)S.buys--;else S.actions--;S.bought=true;S.buyCount=(S.buyCount||0)+1;S.evUsed.push(ev);if(!E_.proj)log(S,`${p.name}: 이벤트 「${E_.ko}」 구매`);
  if(E_.debt){p.debt+=E_.debt;log(S,`${p.name}: 빚 토큰 +${E_.debt}`);}
  if(E_.proj){p.projects.push(ev);log(S,`${p.name}: 프로젝트 「${E_.ko}」에 큐브를 놓음`);if(ev==='Capitalism'&&s===S.cur)CUR_CAPITAL=true;return true;}
  const n=S.players.length;
  switch(ev){
    case 'Alms':if(!S.play.some(isTreasure)){const g=await chooseSupply(S,io,s,{max:4,title:'자선: 비용 $4 이하의 카드를 획득하세요'});if(g)await gain(S,s,g);}else log(S,'사용 중인 보물이 있어 효과 없음');break;
    case 'Borrow':plus(S,s,{buys:1});if(!p.minusCard){p.minusCard=true;plus(S,s,{coins:1});log(S,`${p.name}: −1 카드 토큰을 덱 위에, +$1`);}break;
    case 'Quest':{const opts=[],keys=[];if(p.hand.some(c=>hasT(c,'Attack'))){opts.push('공격 카드 1장 버리기');keys.push('atk');}
      if(p.hand.filter(c=>c==='Curse').length>=2){opts.push('저주 2장 버리기');keys.push('curse');}if(p.hand.length>=6){opts.push('카드 6장 버리기');keys.push('six');}
      opts.push('하지 않음');keys.push('none');const [o]=await chooseOptions(S,io,s,{title:'원정: 하나를 고르세요',options:opts,keys,min:1,max:1,purpose:'quest'});const k=keys[o];
      let cs=[];if(k==='atk'){const [i]=await chooseCards(S,io,s,{min:1,max:1,filter:c=>hasT(c,'Attack'),title:'원정: 버릴 공격 카드를 고르세요',purpose:'discard'});cs=[p.hand.splice(i,1)[0]];}
      else if(k==='curse'){for(let j=0;j<2;j++)cs.push(p.hand.splice(p.hand.indexOf('Curse'),1)[0]);}
      else if(k==='six'){const d=await chooseCards(S,io,s,{min:6,max:6,title:'원정: 버릴 카드 6장을 고르세요',purpose:'discard'});cs=removeIdx(p.hand,d);}
      if(cs.length){log(S,`${p.name}: ${summ(cs)} 버림`);await toDiscard(S,p,cs);await gain(S,s,'Gold');}break;}
    case 'Save':plus(S,s,{buys:1});if(p.hand.length){const [i]=await chooseCards(S,io,s,{min:1,max:1,title:'저축: 턴 끝까지 따로 둘 카드를 고르세요',purpose:'gear'});
      p.mats.aside.push({id:++S.uid,card:p.hand.splice(i,1)[0],by:'Save',hidden:true});log(S,`${p.name}: 카드 1장을 따로 둠`);}break;
    case 'Scouting Party':{plus(S,s,{buys:1});const look=S.aside=[];S.asideHidden=true;for(let j=0;j<5;j++){const c=topCard(p);if(c!=null)look.push(c);}
      const k=Math.min(3,look.length);if(k){const d=await chooseCards(S,io,s,{src:'list',list:look,min:k,max:k,title:`정찰대: 버릴 카드 ${k}장을 고르세요`,purpose:'cartoDiscard'});
        const cs=removeIdx(look,d);await toDiscard(S,p,cs);}
      await orderOntoDeck(S,io,s,look,'정찰대');S.aside=[];S.asideHidden=false;break;}
    case 'Travelling Fair':plus(S,s,{buys:2});S.tfair=true;break;
    case 'Bonfire':{if(!S.play.length)break;const d=await chooseCards(S,io,s,{src:'list',list:S.play,min:0,max:2,title:'모닥불: 폐기할 사용 중인 카드를 2장까지 고르세요',purpose:'bonfire'});
      if(d.length){const cs=removeIdx(S.play,d);log(S,`${p.name}: ${summ(cs)} 폐기`);await toTrash(S,s,cs);}break;}
    case 'Expedition':S.expedition=(S.expedition||0)+2;log(S,'다음 손패 +2장');break;
    case 'Ferry':await moveToken(S,io,s,'ferry','−$2 비용');break;
    case 'Plan':await moveToken(S,io,s,'trash','폐기');break;
    case 'Mission':if(!S.extra){S.missionNext=true;log(S,'임무: 이번 턴 뒤 카드를 살 수 없는 추가 턴');}else log(S,'임무: 직전 턴이 내 턴이라 효과 없음');break;
    case 'Pilgrimage':{p.journey=!p.journey;log(S,`${p.name}: 여정 토큰 ${p.journey?'앞면':'뒷면'}`);if(!p.journey)break;
      const names=[...new Set(S.play)].filter(c=>S.supply[pileKey(c)]>0&&topOf(S,pileKey(c))===c);if(!names.length)break;
      const d=await chooseCards(S,io,s,{src:'list',list:names,min:0,max:3,title:'순례: 같은 카드를 획득할 사용 중인 카드를 3장까지 고르세요',purpose:'pilgrim'});
      for(const i of d)await gain(S,s,names[i]);break;}
    case 'Ball':p.minusCoin=true;log(S,`${p.name}: −$1 토큰을 받음`);for(let j=0;j<2;j++){const g=await chooseSupply(S,io,s,{max:4,title:`무도회: 비용 $4 이하의 카드를 획득하세요 (${j+1}/2)`});if(g)await gain(S,s,g);}break;
    case 'Raid':{const k=S.play.filter(c=>c==='Silver').length;for(let j=0;j<k;j++)if(!await gain(S,s,'Silver'))break;
      for(let j=1;j<n;j++){S.players[(s+j)%n].minusCard=true;}log(S,'습격: 다른 플레이어가 −1 카드 토큰을 덱 위에');break;}
    case 'Seaway':{const g=await chooseSupply(S,io,s,{max:4,filter:isAction,title:'해로: 비용 $4 이하의 행동 카드를 획득하세요'});if(g){await gain(S,s,g);p.tok.buy=g;log(S,`${p.name}: +1 구매 토큰 → ${nm(g)} 더미`);}break;}
    case 'Trade':{const d=await chooseCards(S,io,s,{min:0,max:2,title:'교역: 폐기할 카드를 2장까지 고르세요 (1장당 은화)',purpose:'chapel'});const cs=removeIdx(p.hand,d);
      if(cs.length){log(S,`${p.name}: ${summ(cs)} 폐기`);await toTrash(S,s,cs);for(let j=0;j<cs.length;j++)if(!await gain(S,s,'Silver'))break;}break;}
    case 'Lost Arts':await moveToken(S,io,s,'action','+1 행동');break;
    case 'Training':await moveToken(S,io,s,'coin','+$1');break;
    case 'Pathfinding':await moveToken(S,io,s,'card','+1 카드');break;
    case 'Inheritance':{const g=await chooseSupply(S,io,s,{max:4,filter:c=>isAction(c)&&!hasT(c,'Command'),title:'상속: 사유지 토큰을 놓을 비용 $4 이하 행동 카드를 고르세요'});
      if(g){const c=takeFromSupply(S,g);p.inherit=c;p.inheritSet.push(c);CUR_INHERIT=true;log(S,`${p.name}: 상속 — 사유지가 「${nm(c)}」처럼 사용됨`);}break;}
    /* 제국 */
    case 'Advance':{if(!p.hand.some(isAction))break;const [i]=await chooseCards(S,io,s,{min:0,max:1,filter:isAction,title:'진격: 폐기할 행동 카드를 고르세요 (선택)',purpose:'advance'});
      if(i===undefined)break;const x=p.hand.splice(i,1)[0];log(S,`${p.name}: ${nm(x)} 폐기`);await toTrash(S,s,[x]);
      const g=await chooseSupply(S,io,s,{max:6,filter:isAction,title:'진격: 비용 $6 이하의 행동 카드를 획득하세요'});if(g)await gain(S,s,g);break;}
    case 'Delve':plus(S,s,{buys:1});await gain(S,s,'Silver');break;
    case 'Tax':{const g=await chooseSupply(S,io,s,{max:99,title:'세금: 빚 토큰 2개를 놓을 공급처 더미를 고르세요',purpose:'tax'});
      if(g){S.pileDebt[g]=(S.pileDebt[g]||0)+2;log(S,`세금: ${nm(g)} 더미에 빚 토큰 2개 (현재 ${S.pileDebt[g]}개)`);}break;}
    case 'Banquet':{for(let j=0;j<2;j++)if(!await gain(S,s,'Copper'))break;
      const g=await chooseSupply(S,io,s,{max:5,filter:x=>!isVictory(x),title:'연회: 비용 $5 이하의 승점이 아닌 카드를 획득하세요'});if(g)await gain(S,s,g);break;}
    case 'Ritual':if(await gain(S,s,'Curse')&&p.hand.length){const [i]=await chooseCards(S,io,s,{min:1,max:1,title:'의식: 폐기할 카드를 고르세요 (비용 $1당 승점 토큰 1개)',purpose:'ritual'});
      const x=p.hand.splice(i,1)[0];const v=costS(S,x);log(S,`${p.name}: ${nm(x)} 폐기`);await toTrash(S,s,[x]);addVP(S,s,v,'의식');}break;
    case 'Salt the Earth':{addVP(S,s,1,'소금 뿌리기');const g=await chooseSupply(S,io,s,{max:99,filter:isVictory,title:'소금 뿌리기: 공급처에서 폐기할 승점 카드를 고르세요',purpose:'salt'});
      if(g){const x=takeFromSupply(S,g);log(S,`소금 뿌리기: 공급처의 ${nm(x)} 폐기`);await toTrash(S,s,[x]);}break;}
    case 'Wedding':addVP(S,s,1,'결혼식');await gain(S,s,'Gold');break;
    case 'Windfall':if(!p.deck.length&&!p.discard.length){for(let j=0;j<3;j++)if(!await gain(S,s,'Gold'))break;}else log(S,'횡재: 덱이나 버린 카드 더미가 비어 있지 않아 효과 없음');break;
    case 'Conquest':for(let j=0;j<2;j++)if(!await gain(S,s,'Silver'))break;addVP(S,s,p.curGains.filter(c=>c==='Silver').length,'정복');break;
    case 'Dominate':if(await gain(S,s,'Province'))addVP(S,s,9,'지배');break;
    case 'Triumph':if(await gain(S,s,'Estate'))addVP(S,s,p.curGains.length,'개선');break;
    case 'Annex':{const keep=p.discard.length?await chooseCards(S,io,s,{src:'list',list:p.discard,min:0,max:5,title:'합병: 버린 카드 더미에 남길 카드를 5장까지 고르세요 (나머지는 덱에 섞음)',purpose:'annex'}):[];
      const kept=removeIdx(p.discard,keep);const rest=p.discard;p.discard=kept;p.deck.push(...rest);shuffle(p.deck);
      log(S,`${p.name}: 버린 카드 ${rest.length}장을 덱에 섞음`);await gain(S,s,'Duchy');break;}
    case 'Donate':S.donate=(S.donate||0)+1;log(S,'기부: 이번 턴이 끝난 뒤 처리');break;
    /* 동물원 */
    case 'Delay':{if(!p.hand.some(isAction))break;const [i]=await chooseCards(S,io,s,{min:0,max:1,filter:isAction,title:'미루기: 다음 턴에 사용할 행동 카드를 따로 두세요 (선택)',purpose:'farmhands'});
      if(i===undefined)break;const e={id:++S.uid,card:p.hand.splice(i,1)[0],by:'Delay',hidden:false};p.mats.aside.push(e);p.durEff.push({card:e.card,key:'FarmhandsPlay',data:e.id});log(S,`${p.name}: ${nm(e.card)}을(를) 따로 둠`);break;}
    case 'Desperation':if(await yesno(S,io,s,{title:'절박함: 저주를 획득하고 +1 구매, +$2를 받을까요?',card:'Curse',purpose:'desperation'})&&await gain(S,s,'Curse'))plus(S,s,{buys:1,coins:2});break;
    case 'Gamble':{plus(S,s,{buys:1});const c=topCard(p);if(c==null)break;log(S,`${p.name}: 덱 맨 위 ${nm(c)} 공개`);
      if((isTreasure(c)||isAction(c))){p.deck.push(c);if(await yesno(S,io,s,{title:`도박: 「${nm(c)}」을(를) 사용할까요?`,card:c,purpose:'gamble'})){p.deck.pop();S.play.push(c);await playCard(S,io,s,c);}else{p.deck.pop();await toDiscard(S,p,[c]);}}
      else await toDiscard(S,p,[c]);break;}
    case 'Pursue':{plus(S,s,{buys:1});const named=await chooseName(S,io,s,{title:'추적: 카드 이름을 지목하세요 (덱 위 4장 중 그 카드만 되돌림)',purpose:'name'});
      const rev=[];for(let j=0;j<4;j++){const c=topCard(p);if(c!=null)rev.push(c);}log(S,`${p.name}: 「${nm(named)}」 지목, 공개 — ${summ(rev)||'없음'}`);
      const keep=rev.filter(c=>c===named),rest=rev.filter(c=>c!==named);p.deck.push(...keep);if(rest.length)await toDiscard(S,p,rest);break;}
    case 'Ride':await gainHorse(S,s);break;
    case 'Toil':{plus(S,s,{buys:1});if(!p.hand.some(isAction))break;const [i]=await chooseCards(S,io,s,{min:0,max:1,filter:isAction,title:'노동: 사용할 행동 카드를 고르세요 (선택)',purpose:'play'});
      if(i!==undefined){const c=p.hand.splice(i,1)[0];S.play.push(c);await resolve(S,io,s,c,newRef(S,c));}break;}
    case 'Enhance':{const f=c=>!isVictory(c);if(!p.hand.some(f))break;const [i]=await chooseCards(S,io,s,{min:0,max:1,filter:f,title:'강화: 폐기할 승점이 아닌 카드를 고르세요 (선택)',purpose:'remodel'});
      if(i===undefined)break;const x=p.hand.splice(i,1)[0];log(S,`${p.name}: ${nm(x)} 폐기`);const v=costS(S,x)+2,dv=dOf(S,x);await toTrash(S,s,[x]);
      const g=await chooseSupply(S,io,s,{max:v,dmax:dv,title:`강화: 비용 $${v} 이하의 카드를 획득하세요`});if(g)await gain(S,s,g);break;}
    case 'March':{if(!p.discard.some(isAction))break;const [i]=await chooseCards(S,io,s,{src:'list',list:p.discard,min:0,max:1,filter:isAction,title:'행진: 사용할 행동 카드를 버린 카드 더미에서 고르세요 (선택)',purpose:'play'});
      if(i!==undefined){const c=p.discard.splice(i,1)[0];S.play.push(c);await resolve(S,io,s,c,newRef(S,c));}break;}
    case 'Transport':{const mine=p.exile.filter(isAction);const [o]=mine.length?await chooseOptions(S,io,s,{title:'운송: 하나를 고르세요',options:['공급처의 행동 카드 1장 추방','추방된 내 행동 카드 1장을 덱 위에'],min:1,max:1,purpose:'transport'}):[0];
      if(o===0){const g=await chooseSupply(S,io,s,{max:99,filter:isAction,title:'운송: 추방할 행동 카드를 고르세요',purpose:'tokenPile'});if(g)exileFromSupply(S,s,g,'운송');}

async function resolve(S,io,s,c,ref){
  if(!ref)ref=newRef(S,c);
  if(isAction(c))S.played=(S.played||0)+1; // 이번 턴 행동 카드 사용 횟수 (공모자)
  log(S,`${S.players[s].name}: ▶ ${nm(c)} 사용`);
  // 부랑아: 사용 중일 때 다른 공격 카드를 사용하면, 먼저 부랑아를 폐기하고 용병 획득 가능
  if(hasT(c,'Attack')&&s===S.cur&&S.ns&&S.ns.Mercenary!=null){let k=S.play.filter(x=>x==='Urchin').length-(c==='Urchin'&&!ref.gone?1:0);
    while(k-->0&&await yesno(S,io,s,{title:'부랑아: 사용 중인 부랑아를 폐기하고 용병을 획득할까요?',card:'Urchin',purpose:'urchin'})){
      const i=S.play.indexOf('Urchin');if(i<0)break;S.play.splice(i,1);log(S,`${S.players[s].name}: 부랑아 폐기`);await toTrash(S,s,['Urchin']);await gainNS(S,s,'Mercenary');}}
  const pp=S.players[s];
  if(s===S.cur){const k=pileKey(c),t=pp.tok||{};   // 모험 토큰: 그 더미의 카드를 사용하면 먼저 보너스
    if(t.card===k)plus(S,s,{cards:1});if(t.action===k)plus(S,s,{actions:1});if(t.buy===k)plus(S,s,{buys:1});if(t.coin===k)plus(S,s,{coins:1});
    if(pp.champion>0&&isAction(c))plus(S,s,{actions:pp.champion});}      // 용사: 행동 카드를 사용할 때마다 +1 행동
  await kilnFx(S,io,s,c);
  if(ENLIGHT&&CARDS[c].types.includes('Treasure')&&!EFFECTS[c]){log(S,`깨달음: ${nm(c)} 대신 +1 카드, +1 행동`);plus(S,s,{cards:1,actions:1});if(PROPH(S,'Great Leader')&&s===S.cur)plus(S,s,{actions:1});io.update&&io.update();return;}
  if(isAction(c)&&enchanted(S,s)){log(S,`요술사: ${nm(c)} 대신 +1 카드, +1 행동`);plus(S,s,{cards:1,actions:1});io.update&&io.update();return;}
  // 동물원 방식: 행동 카드를 사용할 때, 카드 대신 방식의 지시를 따를 수 있음
  if(s===S.cur&&isAction(c)&&S.ways&&S.ways.length){
    const [o]=await chooseOptions(S,io,s,{title:`「${nm(c)}」 — 어떻게 사용할까요?`,options:[`카드 그대로: ${CARDS[c].sum||CARDS[c].text.split('\n')[0]}`,...S.ways.map(w=>`${EVENTS[w].ko}: ${EVENTS[w].text.split('\n')[0]}`)],min:1,max:1,purpose:'way',card:c});
    if(o>0){const w=S.ways[o-1];log(S,`${pp.name}: ${nm(c)} — ${EVENTS[w].ko}`);if(s===S.cur)S.citadelDone=true;await wayFx(S,io,s,w,c,ref);io.update&&io.update();return;}}
  const cit=s===S.cur&&isAction(c)&&!S.citadelDone&&hasProj(pp,'Citadel');if(s===S.cur&&isAction(c))S.citadelDone=true;
  const coins0=S.coins;
  await EFFECTS[c](S,io,s,ref);
  if(hasTrait(S,c,'Reckless')){log(S,`무모한: ${nm(c)} 지시를 한 번 더`);await EFFECTS[c](S,io,s,ref);}
  if(s===S.cur&&isAction(c)){
    if(S.harborPend>0&&!ref.harborSrc){const k=S.harborPend;S.harborPend=0;if(S.coins>coins0){plus(S,s,{coins:k});log(S,`항구 마을: +$${k}`);}}
    if(c==='Harbor Village')S.harborPend=(S.harborPend||0)+1;
    if(!hasT(c,'Command'))for(const w of pp.watch.slice())if(w.kind==='flagship'){endWatch(S,s,w);log(S,`기함: ${nm(c)} 한 번 더`);await EFFECTS[c](S,io,s,ref);}
    if(hasTrait(S,c,'Inspiring'))await playNewAction(S,io,s,'영감을 주는');}
  if(s===S.cur&&isAction(c)){
    if(S.daimyo>0&&!hasT(c,'Command')){const k=S.daimyo;S.daimyo=0;for(let j=0;j<k;j++){log(S,`다이묘: ${nm(c)} 한 번 더`);await EFFECTS[c](S,io,s,ref);}}
    if(PROPH(S,'Great Leader'))plus(S,s,{actions:1});
    if(PROPH(S,'Approaching Army')&&hasT(c,'Attack'))plus(S,s,{coins:1});}
  if(s===S.cur&&isAction(c)&&S.lasting.some(l=>l.type==='frigate'&&l.owner!==s&&l.targets.includes(s))&&pp.hand.length>4)await discardDownTo(S,io,[s],4,'프리깃');
  if(cit){log(S,`성채 도시: ${nm(c)} 한 번 더`);await resolve(S,io,s,c,ref);}
  await afterLiaison(S,io,s,c);
  if(hasAlly(S,'Fellowship of Scribes')&&s===S.cur&&isAction(c)&&pp.hand.length<=4&&await spendFavor(S,io,s,1,'서기 협회: +1 카드를 받을까요?','scribes'))drawN(pp,1);
  io.update&&io.update();
  if(s===S.cur&&isAction(c)&&pp.tavern){   // 행동 처리 직후: 왕실 마차 / 왕국의 동전 호출
    while(pp.tavern.includes('Royal Carriage')&&!ref.gone&&S.play.includes(c)&&await yesno(S,io,s,{title:`왕실 마차: 「${nm(c)}」을(를) 한 번 더 사용할까요?`,card:c,purpose:'rcarriage'})){
      callReserve(S,s,'Royal Carriage');await resolve(S,io,s,c,ref);}
    while(pp.tavern.includes('Coin of the Realm')&&await yesno(S,io,s,{title:'왕국의 동전: 호출해 +2 행동을 얻을까요?',card:'Coin of the Realm',purpose:'cotr'})){
      callReserve(S,s,'Coin of the Realm');plus(S,s,{actions:2});}}
}
function callReserve(S,s,c){const p=S.players[s];const i=p.tavern.indexOf(c);if(i<0)return false;p.tavern.splice(i,1);
  if(s===S.cur)S.play.push(c);else p.durCards.push(c);log(S,`${p.name}: 선술집 매트의 ${nm(c)} 호출`);return true;}
function toTavern(S,s,c,ref){ // 사용 중인 이 카드를 선술집 매트로
  if(ref.gone||!S.play.includes(c))return;S.play.splice(S.play.lastIndexOf(c),1);ref.gone=true;S.players[s].tavern.push(c);log(S,`${S.players[s].name}: ${nm(c)}을(를) 선술집 매트에 놓음`);}
async function overpay(S,io,s,c,over){const p=S.players[s];
  if(c==='Farrier'){S.farrier=(S.farrier||0)+over;log(S,`편자공: 이번 턴 끝에 +${over} 카드`);}
  if(c==='Stonemason')for(let j=0;j<2;j++){const g=await chooseSupply(S,io,s,{exact:over,filter:isAction,title:`석공 초과 지불: 비용이 정확히 $${over}인 행동 카드를 획득하세요 (${j+1}/2)`});if(g)await gain(S,s,g);}
  if(c==='Herald')for(let j=0;j<over&&p.discard.length;j++){
    const [i]=await chooseCards(S,io,s,{src:'list',list:p.discard,min:1,max:1,title:`전령 초과 지불: 덱 위에 놓을 카드를 버린 카드 더미에서 고르세요 (${j+1}/${over})`,purpose:'harbinger'});
    p.deck.push(p.discard.splice(i,1)[0]);}
  if(c==='Infirmary'){const i=p.discard.lastIndexOf('Infirmary');if(i<0)return;p.discard.splice(i,1);S.play.push('Infirmary');const r=newRef(S,'Infirmary');
    for(let j=0;j<over;j++)await resolve(S,io,s,'Infirmary',r);}}
async function playCard(S,io,s,c){ // 이미 S.play에 놓인 카드를 사용 (선원 등)
  if(isAction(c))await resolve(S,io,s,c,newRef(S,c));
  else if(isTreasure(c)){log(S,`${S.players[s].name}: ${nm(c)} 냄`);await playTreasure(S,io,c,newRef(S,c));}
}
async function playTreasure(S,io,c,ref){
  if(isAction(c)&&!CARDS[c].types.includes('Treasure')){await resolve(S,io,S.cur,c,ref||newRef(S,c));return;}   // 자본주의: 보물로 사용하는 행동 카드
  await kilnFx(S,io,S.cur,c);
  if(PROPH(S,'Good Harvest')&&!(S.harvest||[]).includes(c)){(S.harvest=S.harvest||[]).push(c);plus(S,S.cur,{buys:1,coins:1});}
  if(PROPH(S,'Panic'))S.buys+=2;
  if(!S.hwUsed&&S.lasting.some(l=>l.type==='highway'&&l.owner!==S.cur&&l.targets.includes(S.cur))){S.hwUsed=true;log(S,`노상 강도단: ${nm(c)}은(는) 아무 효과가 없음`);return;}
  if(isAction(c)&&enchanted(S,S.cur)){log(S,`요술사: ${nm(c)} 대신 +1 카드, +1 행동`);plus(S,S.cur,{cards:1,actions:1});return;}
  addC(S,S.envious&&(c==='Silver'||c==='Gold')?1:CARDS[c].coin||0);   // 질투함: 은화·금화는 $1
  if(c==='Silver'&&!S.silver){S.silver=true;addC(S,S.merchant);}
  if(c==='Astrolabe'){S.buys++;if(ref)later(S,ref,'Astrolabe');}
  // 사략선: 이번 턴 처음 내는 은화/금화는 (돈은 얻고) 폐기
  if((c==='Silver'||c==='Gold')&&!S.corsairHit&&S.lasting.some(l=>l.type==='corsair'&&l.targets.includes(S.cur))){
    S.corsairHit=true;const i=S.play.lastIndexOf(c);if(i>=0){S.play.splice(i,1);await toTrash(S,S.cur,[c]);if(ref)ref.gone=true;log(S,`사략선: ${S.players[S.cur].name}의 ${nm(c)} 폐기`);}}
  if(TREASURE_FX[c])await TREASURE_FX[c](S,io,S.cur,ref||newRef(S,c));
  if(hasTrait(S,c,'Reckless')){log(S,`무모한: ${nm(c)} 한 번 더`);addC(S,CARDS[c].coin||0);if(TREASURE_FX[c])await TREASURE_FX[c](S,io,S.cur,ref||newRef(S,c));}
  await afterLiaison(S,io,S.cur,c);
  io&&io.update&&io.update();
}

async function endBuyPhase(S,io,s){if(S.buyEnded)return;if(S.phase==='action')await enterBuy(S,io,s);S.buyEnded=true;const p=S.players[s];

    p.tavern.splice(p.tavern.indexOf('Wine Merchant'),1);p.discard.push('Wine Merchant');log(S,`${p.name}: 포도주 상인을 매트에서 버림`);}

    case 'town':return [0];case 'innkeeper':return [p.hand.length<=3?2:1];case 'crier':return [0];case 'blacksmith':return [p.hand.length<=3?0:1];case 'broker':return [2];
    case 'modify':return [1];case 'hillfort':return [0];case 'stronghold':return [0];case 'specialist':return [0];case 'bauble':return [0,1];case 'nomadsOpt':return [0];case 'bplanRot':return [0];
    case 'scepter':return [0];case 'way':return [0];case 'nowLater':return [0];case 'sleigh':return [0];case 'transport':return [0];
    case 'scrap':return [0,1,2,3,4,5].slice(0,req.min);case 'bgArt':return [0];case 'plot':return [(p.plot||0)>=2?1:0];

function botNumber(S,seat,req){if(req.purpose==='mpass'){const h=req.high||0;return h+1<=6?h+1:0;}return req.min;}
function botCoffers(S,s){const p=S.players[s],c=p.coffers||0;if(!c||S.bought&&S.buys<1)return 0;
  for(const [t,card] of [[11,'Colony'],[8,'Province'],[6,'Gold']])if(S.coins<t&&S.coins+c>=t&&S.supply[card]>0)return t-S.coins;return 0;}
function botAnswer(S,seat,req){
  if(req.type==='turn')return botTurn(S,seat);
  if(req.type==='cards')return botCards(S,seat,req);
  if(req.type==='supply')return botSupply(S,seat,req);

  if(req.type==='number')return botNumber(S,seat,req);
  if(req.type==='yesno'){if(req.purpose==='tiaraTop')return keepVal(req.card)>=3;
    if(req.purpose==='jackDiscard'||req.purpose==='ironDiscard')return keepVal(req.card)<=1;
    if(req.purpose==='scavDeck')return true;
    if(req.purpose==='exchange'||req.purpose==='duplicate')return true;

    if(req.purpose==='rcarriage')return keepVal(req.card)>=4;
    if(req.purpose==='callGuide')return S.players[seat].hand.filter(c=>keepVal(c)<=1).length>=3;
    if(req.purpose==='callRatcatcher'||req.purpose==='callTransmogrify')return S.players[seat].hand.some(c=>keepVal(c)<=-2);
    if(req.purpose==='traderSwap')return keepVal(req.card)<=-2;
    if(req.purpose==='engineer')return true;if(req.purpose==='pixie'||req.purpose==='changeling'||req.purpose==='zmason')return req.purpose==='zmason';
    if(['rotate','ccPay','acolyteSelf','foi','caved','desertg','pickpocket','island','witches','citystate','trapper','architect','nomads','scribes','mfolk','crafters','forestd','mtowns','woodw'].includes(req.purpose))return ['ccPay','acolyteSelf','island','witches','mfolk','citystate','scribes','pickpocket'].includes(req.purpose);
    if(req.purpose==='goldMine')return S.players[seat].debt<4;if(req.purpose==='snakeWitch')return S.supply.Curse>0;
    if(req.purpose==='siren')return S.players[seat].hand.some(c=>isAction(c)&&keepVal(c)<=3);if(req.purpose==='firstMate')return true;
    if(req.purpose==='ccDiscard')return S.players[seat].hand.filter(c=>keepVal(c)<=1).length>=2;
    if(req.purpose==='unexile')return keepVal(req.card)>=1;if(req.purpose==='desperation'||req.purpose==='afair'||req.purpose==='hlodge')return req.purpose==='hlodge'?S.players[seat].hand.filter(c=>keepVal(c)<=1).length>=3:false;
    if(req.purpose==='gamble')return keepVal(req.card)>=0;
    if(req.purpose==='cargo')return keepVal(req.card)>=3;
    if(req.purpose==='zspy')return keepVal(req.card)<=1;if(req.purpose==='sky')return S.players[seat].hand.filter(c=>keepVal(c)<=1).length>=3;if(req.purpose==='charm')return gainVal(S,req.card)>0;
    if(req.purpose==='vaultOther')return S.players[seat].hand.filter(c=>keepVal(c)<=1).length>=2;
    return req.purpose==='library'?S.actions<1:req.purpose==='miningVillage'?false:true;}
  return null;
}

function sceneBg(c){const [a,b]=SCENE[c]||['#ddd','#888'];
  return `radial-gradient(ellipse 70% 40% at 50% 100%,rgba(0,0,0,.28),transparent),linear-gradient(180deg,${a} 0%,${a} 52%,${b} 62%,${b} 100%)`;}
function artInner(c){const d=CARDS[c];
  if(isPlainTreasure(c)){const m=c==='Copper'?'cu':c==='Silver'?'ag':c==='Platinum'?'pt':'';
    return `<div class="coins">${[[-22,14],[20,16],[0,-6]].map(([x,y])=>`<span class="coin ${m}" style="transform:translate(${x}%,${y}%)">${d.coin}</span>`).join('')}</div>`;}
  return `<span class="ico">${d.icon}</span>`;}
function txHTML(c,size){const d=CARDS[c];
  if(isTreasure(c)&&isVictory(c)&&d.vp!=null)return `<div class="tx tv duo"><span class="coin bigcoin">${d.coin}</span><div class="shield">${d.vp}</div></div>`;
  if(c==='Curse')return `<div class="tx tv"><div class="shield neg">-1</div></div>`;
  if(isPlainTreasure(c))return `<div class="tx tv"><span class="coin bigcoin ${c==='Copper'?'cu':c==='Silver'?'ag':c==='Platinum'?'pt':''}">${d.coin}</span></div>`;
  if(isVictory(c)&&!isAction(c)&&d.vp!=null&&!d.text.includes('―'))return `<div class="tx tv"><div class="shield">${d.vp}</div></div>`;
  if(size==='s'){const b=d.text.split('\n').filter(l=>/^\+/.test(l)&&!l.includes('/'));
    return `<div class="tx">${d.sum?`<div class="sm">${esc(d.sum)}</div>`:b.map(l=>`<div class="bn">${esc(l)}</div>`).join('')}${d.vp&&isAction(c)?`<div class="shield vp-s">${d.vp}</div>`:''}</div>`;}
  return `<div class="tx${d.text.length>60?' long':''}">${d.text.split('\n').map(l=>!l?'':l.startsWith('―')?'<hr>':l.startsWith('@')?`<div class="shield vp-s">${l.slice(1)}</div>`:/^(\+|\$\d+$)/.test(l)&&!l.includes('/')?`<div class="bn">${esc(l)}</div>`:`<div class="p">${esc(l)}</div>`).join('')}</div>`;}
function eventHTML(ev,cls=''){const E_=EVENTS[ev],inG=screen==='game'&&G;
  const c=E_.proph?(inG&&G.prophecy===ev?(G.prophActive?'<span class="lmv" style="background:#c0581a">발동 중</span>':`<span class="lmv" style="background:#d08a1a">☀️${G.sun}</span>`):'<span class="lmk" style="color:#8a4a0a">예언</span>'):E_.trait?'<span class="lmk" style="color:#6a4a1a">특성</span>':E_.way?'<span class="lmk" style="color:#1a4a6a">방식</span>':E_.lm?(inG&&G.lmVP&&G.lmVP[ev]!=null?`<span class="lmv">★${G.lmVP[ev]}</span>`:'<span class="lmk">랜드마크</span>'):`${E_.cost||!E_.debt?`<span class="coin">${E_.cost}</span>`:''}${E_.debt?`<span class="debt">${E_.debt}</span>`:''}`;
  const extra=ev==='Obelisk'&&inG&&G.obelisk?`\n▶ 선택된 더미: ${nm(G.obelisk)}`:E_.trait&&inG&&G.traits&&G.traits[ev]?`\n▶ ${nm(G.traits[ev])} 더미`:ev==='Way of the Mouse'&&inG&&G.mouse?`\n▶ 따로 둔 카드: ${nm(G.mouse)} — ${CARDS[G.mouse].sum||CARDS[G.mouse].text.split('\n')[0]}`:'';
  const own=E_.proj&&inG?G.players.filter(p=>hasProj(p,ev)).map(p=>`<i>${esc(p.name.slice(0,4))}</i>`).join(''):'';
  return `<div class="ev ${E_.lm?'lm ':''}${E_.proj?'proj ':''}${E_.way?'way ':''}${E_.trait?'trait ':''}${E_.proph?'proph '+(inG&&G.prophActive?'on ':''):''}${cls}" data-ev="${esc(ev)}"><div class="fr"><div class="en"><span>${E_.ko}${E_.proj?' <small style="opacity:.6">프로젝트</small>':''}</span><span class="ec">${c}</span></div><div class="et">${esc(E_.text+extra).replace(/\n/g,'<br>')}${own?`<div class="own">${own}</div>`:''}</div></div></div>`;}
function isPlainTreasure(c){return c!=='Curse'&&isTreasure(c)&&/^\$\d+$/.test(CARDS[c].text);}
function cardHTML(c,size=''){const d=CARDS[c];
  const tcls=c==='Curse'?'t-curse':isNight(c)?(isAction(c)?'t-an':isDuration(c)?'t-night-dur':'t-night'):hasT(c,'Reserve')&&isTreasure(c)?'t-tr-res':hasT(c,'Reserve')&&isVictory(c)?'t-vic-res':hasT(c,'Reserve')?'t-reserve':hasT(c,'Shelter')?(hasT(c,'Reaction')?'t-sh-react':isAction(c)?'t-sh-act':'t-sh-vic'):hasT(c,'Ruins')?'t-ruins':isAction(c)&&isTreasure(c)?'t-at':hasT(c,'Reaction')&&isVictory(c)?'t-vr':hasT(c,'Reaction')&&isTreasure(c)?'t-tr-react':hasT(c,'Reaction')&&isDuration(c)?'t-dur-react':hasT(c,'Reaction')?'t-reaction':isTreasure(c)&&isDuration(c)?'t-dur-treasure':isTreasure(c)&&isVictory(c)?'t-tv':isAction(c)&&isVictory(c)?'t-av':isDuration(c)?'t-duration':isTreasure(c)?'t-treasure':isVictory(c)?'t-victory':c==='Curse'?'t-curse':'t-action';
  return `<div class="card ${size} ${tcls}"><div class="frame">
    <div class="nm">${d.ko}<small>${c}</small></div>
    <div class="art" style="background:${sceneBg(c)}">${artInner(c)}</div>
    ${txHTML(c,size)}
    <div class="ft">${d.cost||!d.debt?`<span class="coin">${d.cost}${d.over?'<sup>+</sup>':''}</span>`:''}${d.debt?`<span class="debt">${d.debt}</span>`:''}<span class="ty">${d.types.map(t=>TYPE_KO[t]).join(' · ')}</span><span class="gap"></span></div></div></div>`;}
const backHTML=(size='')=>`<div class="card back ${size}"><div class="frame"></div></div>`;
const slotHTML=(size='s')=>`<div class="card slot ${size}"></div>`;

<b>구매</b> — 보물은 구매 전에 내야 하며, 한 번이라도 구매한 뒤에는 보물을 더 낼 수 없습니다.<br>
<b>종료</b> — 속주 더미가 비거나, 아무 공급처 더미 3개가 비면 그 턴이 끝날 때 게임이 끝납니다.<br>
<b>승리</b> — 승점이 가장 높은 사람. 동점이면 턴을 덜 한 사람이 이기고, 그래도 같으면 공동 승리입니다.<br>
<b>인원</b> — 2인: 승점 더미 8장 / 3~4인: 12장, 저주 10×(인원−1)장, 백금화 12장. 승점 왕국 카드(정원·공작·방앗간·하렘·귀족)도 같은 수입니다.<br>
<b>음모</b> — 다리의 비용 할인은 그 턴 동안 모든 카드에 적용되고 $0 아래로는 내려가지 않습니다. 이중 종류 카드(방앗간·귀족·하렘 등)는 두 종류 모두에 해당합니다.<br>
<b>항해</b> — 주황색 <b>지속</b> 카드는 다음 턴에 할 일이 남아 있으면 정리 단계에 버리지 않고 계속 사용 중으로 남았다가, 마지막으로 효과를 낸 턴의 정리 단계에 버립니다. 알현실로 지속 카드를 쓰면 알현실도 함께 남습니다. 턴 시작 시 효과가 여럿이면 순서를 고릅니다. 전초기지의 추가 턴은 동점 판정의 턴 수에 넣지 않습니다. 섬 매트·원주민 마을 매트·따로 둔 카드도 게임 끝에 모두 내 카드로 셉니다.<br>
<b>번영</b> — 백금화·식민지를 쓰면 식민지 더미가 비어도 게임이 끝납니다. 승점 토큰은 게임 끝에 점수에 더합니다. '보물 모두 내기'는 선택이 필요 없는 보물만 내고(은행은 마지막), 모루·수정 구슬·투자·티아라·군자금은 한 장씩 눌러서 냅니다. 행상인 할인은 구매 단계에만 적용됩니다.<br>
<b>변경지</b> — '정리 단계가 아닐 때' 버리거나 폐기하면 발동하는 카드(터널·직조공·오솔길·유목민)는 어떤 효과로 버리거나 폐기해도 발동합니다. 다른 사람 턴에 반응으로 사용한 카드는 다음 내 정리 단계까지 사용 중으로 남고, 그 카드의 +행동·+구매·+$는 적용되지 않습니다(카드 뽑기는 적용).<br>
<b>풍요·길드</b> — 동전 토큰은 내 턴 중 아무 때나 1개당 +$1로 쓸 수 있습니다. 비용 옆에 +가 있는 카드는 구매할 때 초과 지불할 수 있습니다(할인이 초과 지불을 싸게 만들지는 않음). 젊은 마녀가 있으면 비용 $2~$3 재앙 더미가, 뱃사공이 있으면 비용 $3~$4 더미가 공급처 밖에 추가됩니다. 보상 카드는 마상 시합으로만 얻고(2인 1장씩, 3인 이상 2장씩), 노상강도가 있는 게임에서는 행동 단계에 카드를 획득할 때마다 1장을 뽑습니다.<br>
<b>암흑시대</b> — 기사단과 폐허는 섞인 더미로, 맨 위 카드만 획득할 수 있습니다. 약탈자 타입 카드(광신도·시체 수레·약탈자)가 있으면 폐허 더미 10×(인원−1)장이 공급처에 추가됩니다. 쥐떼 더미는 20장입니다. 광인·용병·전리품은 공급처 밖 더미입니다. 보호소를 쓰면 시작 덱의 사유지 3장 대신 오두막·공동묘지·잡초 무성한 사유지로 시작합니다. 오합지졸은 고른 카드를 공급처에 그대로 둔 채 사용합니다.<br>
<b>모험</b> — 이벤트는 카드가 아니라, 구매 단계에 구매 1회와 $를 써서 사는 효과입니다(할인 적용 안 됨). 예약 카드는 사용하면 선술집 매트에 놓였다가, 조건이 되면 호출해 사용 중으로 가져옵니다. 여행자(시종·농부)는 사용 중에서 버릴 때 다음 단계 카드로 교환할 수 있습니다. 고용인·용사는 게임 끝까지 사용 중입니다. −1 카드 토큰은 다음에 뽑을 때 1장 덜, −$1 토큰은 다음에 $를 받을 때 $1 덜 받습니다. 여정 토큰은 앞면으로 시작합니다. 머나먼 땅은 게임 끝에 선술집 매트에 있을 때만 4점입니다.<br>
<b>제국</b> — 육각형 갈색 숫자는 <b>빚</b> 비용입니다. 빚 비용이 있는 카드는 $ 없이도 살 수 있지만 그만큼 빚 토큰을 받고, 빚이 남아 있으면 카드나 이벤트를 살 수 없습니다. 빚은 구매 단계에 $1당 1개씩 갚습니다(구매를 쓰지 않음). 빚 비용이 있는 카드는 '$X 이하' 효과로 얻을 수 없습니다. 분할 더미(정착민/번화한 마을 등)와 성 더미는 맨 위 카드만 획득할 수 있으며, 더미 전체가 비어야 빈 더미로 셉니다. 성 더미는 2인 8장, 3인 이상 12장입니다. 모음 카드(농산물 시장·신전·거친 사냥)는 자기 더미에 승점 토큰을 모읍니다. 랜드마크는 사지 않으며 게임 내내 적용됩니다. 산길 입찰은 첫 속주를 얻은 사람의 왼쪽부터 한 번씩, 그 사람이 마지막으로 합니다.<br>
<b>야상곡</b> — 구매 단계 다음에 <b>밤 단계</b>가 있어, 손의 밤 카드(검은 테두리)를 행동 없이 원하는 만큼 사용할 수 있습니다. 운명 카드는 <b>축복</b>을, 파멸 카드는 <b>흉조</b>를 줍니다(여러 명이 '다음 흉조'를 받으면 모두 같은 흉조). 들판·숲·강의 선물은 정리 단계까지 보관합니다. <b>가보</b>가 있는 카드를 쓰면 시작 덱의 동화 대신 그 가보를 받습니다. 도깨비불·임프·유령·소원·박쥐는 공급처 밖 더미이고, 강령술사가 있으면 좀비 3장이 폐기 더미에서 시작합니다. '교환'은 획득이 아니라 카드를 더미로 되돌리고 바꾸는 것입니다. 수호자·유령 마을·죄악의 소굴·야경꾼은 손으로 획득합니다.<br>
<b>르네상스</b> — <b>마을 사람</b>은 행동 단계에 1개당 +1 행동으로 씁니다(다음 턴으로 넘어감). <b>소품</b>(깃발·뿔나팔·열쇠·등불·보물 상자)은 한 번에 한 사람만 가지며, 다른 사람이 가져가면 옮겨 갑니다. <b>프로젝트</b>는 구매 1회로 사서 내 큐브를 올리면 게임 내내 적용되고, 같은 프로젝트는 두 번 살 수 없습니다. 함대를 가진 사람은 게임이 끝난 뒤 한 턴씩 더 합니다.<br>
<b>동물원</b> — <b>추방</b>한 카드는 내 추방 매트에 놓이고 게임 끝에 내 카드로 셉니다. 같은 카드를 획득할 때 추방 매트의 그 카드를 모두 버린 카드 더미로 옮길 수 있습니다. <b>말</b>은 공급처 밖 30장 더미이며, 사용하면 더미로 돌아갑니다. <b>방식</b>이 있으면 행동 카드를 사용할 때마다 카드 대신 방식의 지시를 따를 수 있습니다(지속 카드를 방식으로 쓰면 남지 않음).<br>
<b>동맹</b> — <b>연락책</b>이 왕국에 있으면 <b>동맹 카드</b> 1장을 쓰고(설정에서 고르거나 무작위), 모두 호의 1개로 시작합니다. 호의는 동맹 카드의 효과에 씁니다. 마을 주민들·점술가들·충돌·요새들·오디세이·마법사들은 4종이 4장씩 쌓인 더미로 맨 위 카드만 얻을 수 있고, '더미를 돌리면' 맨 위 종류가 모두 맨 아래로 갑니다. 항해의 추가 턴에는 손에서 카드를 3장까지만 사용할 수 있습니다.<br>
<b>약탈</b> — <b>전리품</b>은 15종 × 2장이 섞인 공급처 밖 더미($7)로, "전리품을 획득"하면 맨 위 카드를 얻습니다. <b>특성</b>은 게임 시작 시 행동·보물 왕국 더미 하나에 무작위로 붙어 그 더미의 카드 모두에 적용됩니다. "다음에 ~할 때" 효과가 있는 지속 카드는 그 일이 일어날 때까지(여러 턴이라도) 사용 중으로 남습니다.<br>
<b>떠오르는 해</b> — <b>징조</b> 카드가 있으면 <b>예언</b> 1장(설정에서 고르거나 무작위)에 해 토큰(2인 5개, 3인 8개, 4인 10개)을 놓고, 징조 카드를 쓸 때마다 1개씩 치웁니다. 마지막 해를 치우면 예언이 발동해 게임 끝까지 적용됩니다. <b>그림자</b> 카드는 덱에 있어도 손에 있는 것처럼 사용할 수 있고(손패 위 "덱의 그림자" 버튼), 덱을 섞을 때 맨 아래로 갑니다. 여러 카드가 빚을 줍니다(빚은 제국과 같은 규칙).</div><button onclick="closeModal()">닫기</button>`);}

/* ---------- 왕국 카드 고르기 ---------- */
let KSEL=[...FIRST_GAME],EVSEL=[],kEditable=true,kOnChange=()=>{};
let RSETS={base:true,intrigue:true,seaside:true,prosperity:true,hinterlands:true,cornguilds:true,darkages:true,adventures:true,empires:true,nocturne:true,renaissance:true,menagerie:true,allies:true,plunder:true,risingsun:true};
let ALSEL=''; // 동맹 카드 (비우면 무작위)
const liaisonIn=()=>KSEL.some(c=>hasT(c,'Liaison')||(ROT[c]||[]).some(x=>hasT(x,'Liaison')));
let PCMODE='auto'; // 백금화·식민지: auto(번영 카드 5장 이상이면 사용) / on / off
const pcOn=()=>PCMODE==='on'||(PCMODE==='auto'&&KSEL.filter(c=>SET_OF(c)==='prosperity').length>=5);
let SHMODE='auto'; // 보호소: auto(암흑시대 카드 5장 이상이면 사용) / on / off
const shOn=()=>SHMODE==='on'||(SHMODE==='auto'&&KSEL.filter(c=>SET_OF(c)==='darkages').length>=5);
function kingdomHTML(){
  const presets=PRESETS.map((p,i)=>`<button class="sm" onclick="kSet([...PRESETS[${i}].k],[...(PRESETS[${i}].ev||[])])">${p.ko}</button>`).join('');
  const chk=Object.keys(SETS).map(k=>`<label class="chk"><input type="checkbox" ${RSETS[k]?'checked':''} onchange="RSETS['${k}']=this.checked"> ${SETS[k].ko}</label>`).join('');
  const shown=k=>sortKingdom(KINGDOM.filter(c=>SET_OF(c)===k&&(kEditable||KSEL.includes(c))));
  return `${kEditable?`<div class="kbar"><span>추천:</span>${presets}</div>
    <div class="kbar"><button class="sm" onclick="kRandom()">🎲 무작위 10장</button><span>사용할 세트:</span>${chk}</div>`:''}
  <div class="kbar"><span>백금화·식민지:</span>${kEditable?`<select onchange="PCMODE=this.value;kOnChange()"><option value="auto" ${PCMODE==='auto'?'selected':''}>자동 (번영 카드 5장 이상)</option><option value="on" ${PCMODE==='on'?'selected':''}>사용</option><option value="off" ${PCMODE==='off'?'selected':''}>사용 안 함</option></select>`:''}<b>${pcOn()?'사용':'사용 안 함'}</b></div>
  <div class="kbar"><span>보호소(시작 덱):</span>${kEditable?`<select onchange="SHMODE=this.value;kOnChange()"><option value="auto" ${SHMODE==='auto'?'selected':''}>자동 (암흑시대 카드 5장 이상)</option><option value="on" ${SHMODE==='on'?'selected':''}>사용</option><option value="off" ${SHMODE==='off'?'selected':''}>사용 안 함</option></select>`:''}<b>${shOn()?'사용':'사용 안 함'}</b></div>
  ${liaisonIn()?`<div class="kbar"><span>동맹 카드 (연락책이 있어 사용):</span>${kEditable?`<select onchange="ALSEL=this.value;kOnChange()"><option value="">무작위</option>${ALLY_NAMES.map(a=>`<option value="${esc(a)}" ${ALSEL===a?'selected':''}>${ALLIES[a].ko}</option>`).join('')}</select>`:''}<b>${ALSEL?ALLIES[ALSEL].ko:'무작위'}</b>${ALSEL?`<small>${esc(ALLIES[ALSEL].text)}</small>`:''}</div>`:''}
  <div class="kbar"><b>${KSEL.length}/10 선택</b>${kEditable?'<small>(카드를 눌러 직접 고를 수도 있어요)</small>':''}</div>
  ${Object.keys(SETS).filter(k=>shown(k).length).map(k=>`<div class="kset"><div class="ksh">${SETS[k].ko}<small>${KSEL.filter(c=>SET_OF(c)===k).length}장</small></div>
    <div class="kgrid">${shown(k).map(c=>`<div class="kpick ${KSEL.includes(c)?'on':''}" data-card="${c}" ${kEditable?'onclick="kToggle(this.dataset.card)"':''}>${cardHTML(c,'s')}</div>`).join('')}</div></div>`).join('')}
  ${(kEditable&&(RSETS.adventures||RSETS.empires||RSETS.renaissance||RSETS.menagerie||RSETS.plunder||RSETS.risingsun))||EVSEL.length?`<div class="kset"><div class="ksh">이벤트·랜드마크<small>${EVSEL.length}/2장 · 이벤트는 구매로 사는 효과, 랜드마크는 게임 내내 적용되는 규칙, 프로젝트는 사면 내 큐브를 올려 계속 적용, 방식은 행동 카드를 쓸 때 카드 대신 고를 수 있는 효과, 특성은 무작위 왕국 더미 하나에 붙는 효과, 예언은 해 토큰이 모두 없어지면 발동</small></div>
    ${kEditable?`<div class="kbar"><button class="sm" onclick="EVSEL=shuffle(landPool()).slice(0,2);kOnChange()">🎲 무작위 2장</button><button class="sm" onclick="EVSEL=[];kOnChange()">없음</button></div>`:''}
    ${[['adventures','모험 이벤트',e=>!isLM(e)],['empires','제국 이벤트',e=>!isLM(e)],['empires','제국 랜드마크',isLM],['renaissance','르네상스 프로젝트',e=>!!EVENTS[e].proj],['menagerie','동물원 이벤트',e=>!EVENTS[e].way],['menagerie','동물원 방식',e=>!!EVENTS[e].way],['plunder','약탈 이벤트',e=>!EVENTS[e].trait],['plunder','약탈 특성',e=>!!EVENTS[e].trait],['risingsun','떠오르는 해 이벤트',e=>!EVENTS[e].proph],['risingsun','떠오르는 해 예언 (징조 카드가 있을 때, 비우면 무작위)',e=>!!EVENTS[e].proph]].map(([st,lbl,f])=>{const l=EVENT_NAMES.filter(e=>(EVENTS[e].set||'adventures')===st&&f(e)&&((kEditable&&RSETS[st])||EVSEL.includes(e)));
      return l.length?`<div class="kbar"><small>${lbl}</small></div><div class="kgrid">${l.map(e=>eventHTML(e,'pick '+(EVSEL.includes(e)?'on':'off'))).join('')}</div>`:'';}).join('')}</div>`:''}`;}
const landPool=()=>{const l=EVENT_NAMES.filter(e=>RSETS[EVENTS[e].set||'adventures']);return l.length?l:EVENT_NAMES.slice();};
function evToggle(e){if(EVSEL.includes(e))EVSEL=EVSEL.filter(x=>x!==e);else if(EVSEL.length<2)EVSEL=[...EVSEL,e];kOnChange();}
function kRandom(){const pool=KINGDOM.filter(c=>RSETS[SET_OF(c)]);if(pool.length<10)return alert('사용할 세트를 하나 이상 골라주세요.');kSet(shuffle(pool.slice()).slice(0,10));}
function kSet(list,ev){KSEL=list;if(ev)EVSEL=ev;kOnChange();}
function kToggle(c){if(KSEL.includes(c))KSEL=KSEL.filter(x=>x!==c);else if(KSEL.length<10)KSEL=[...KSEL,c];kOnChange();}

  $app.innerHTML=`<h1 class="logo" style="font-size:40px">DOMINION</h1><div class="sub">로컬 게임 설정</div><div class="wrap">

function myName(){const v=(document.getElementById('nmIn')||{}).value;const n=(v||lsGet('dom_name','')).trim();if(n)lsSet('dom_name',n);return n;}

function showLoot(){openModal(`<h3>💰 전리품 15종 (각 2장, 섞인 더미 · 비용 $7)</h3><div class="mcards">${LOOTS.map(c=>`<div data-card="${esc(c)}">${cardHTML(c,'s')}</div>`).join('')}</div><button onclick="closeModal()">닫기</button>`);}
function showTrash(){openModal(`<h3>🗑 폐기 더미 (${G.trash.length}장)</h3><div class="mcards">${G.trash.map(c=>cardHTML(c,'s')).join('')||'비어 있음'}</div><button onclick="closeModal()">닫기</button>`);}
function showLogModal(){openModal(`<h3>📜 게임 기록</h3><div class="log" style="max-height:60vh;text-align:left">${logHTML()}</div><button onclick="closeModal()">닫기</button>`);
  const l=$modal.querySelector('.log');l.scrollTop=l.scrollHeight;}
function showResult(){const o=G.over;if(!o)return;
  $modal.innerHTML=`<div class="modal"><div class="mbox"><h3>🏆 게임 종료</h3><div>${o.reason}</div>
  ${(()=>{const cols=[...(G.supply.Colony!=null?['Colony']:[]),'Province','Duchy','Estate',...G.kingdom.filter(isVictory),...(G.bane&&isVictory(G.bane)?[G.bane]:[]),...(G.players.some(p=>allCards(p).includes('Demesne'))?['Demesne']:[]),'Curse'];const tk=G.players.some(p=>p.vp);
   return `<div style="overflow-x:auto"><table class="res"><tr><th>순위</th><th>이름</th><th>승점</th>${cols.map(c=>`<th>${nm(c)}</th>`).join('')}${tk?'<th>토큰</th>':''}<th>턴</th><th>카드</th></tr>
   ${o.rows.map((r,i)=>`<tr class="${o.winners.includes(r.seat)?'win':''}"><td>${o.winners.includes(r.seat)?'👑':i+1}</td><td>${esc(r.name)}</td><td><b>${r.vp}</b></td>${cols.map(c=>`<td>${r[c]||0}</td>`).join('')}${tk?`<td>${r.tokens||0}</td>`:''}<td>${r.turns}</td><td>${r.cards}</td></tr>`).join('')}</table></div>`;})()}
  <div>${o.winners.length>1?'공동 승리!':`${esc(G.players[o.winners[0]].name)}님 승리!`}</div>
  <div class="row" style="justify-content:center">${MODE==='local'?'<button class="green" onclick="renderLocalSetup()">다시 하기</button>':''}<button onclick="quitGame(true)">처음으로</button><button onclick="$modal.innerHTML=\'\'">보드 보기</button></div>
  <div class="foot">made by m00n</div></div></div>`;}
function quitGame(force){if(!force&&!G.over&&!confirm('게임에서 나갈까요?'))return;
  if(MODE==='online')leaveRoom();else{G=null;pending=null;MODE=null;renderHome();}}

document.addEventListener('click',e=>{const el=e.target.closest('.ev[data-ev]');if(!el)return;const ev=el.dataset.ev;
  if(el.classList.contains('pick')){if(kEditable)evToggle(ev);return;}if(screen==='game')clickEvent(ev);});
/* 카드 미리보기 (데스크톱 hover / 모바일 길게 누르기) */
const $pv=document.createElement('div');$pv.id='hoverPv';document.body.appendChild($pv);
const canHover=window.matchMedia('(hover:hover)').matches;
function hidePv(){$pv.style.display='none';}
document.addEventListener('mousemove',e=>{if(!canHover)return;const el=e.target.closest('[data-card]');
  const c=el&&el.dataset.card;if(!c||!CARDS[c]||$modal.innerHTML){hidePv();return;}
  if($pv.dataset.c!==c){$pv.innerHTML=cardHTML(c,'big');$pv.dataset.c=c;}
  $pv.style.display='block';const w=290,h=440;
  let x=e.clientX+24;if(x+w>window.innerWidth)x=e.clientX-w-10;
  let y=Math.min(Math.max(8,e.clientY-h/2),window.innerHeight-h-8);$pv.style.left=x+'px';$pv.style.top=y+'px';});
let lpT=null;
document.addEventListener('touchstart',e=>{const el=e.target.closest('[data-card]');if(!el||!el.dataset.card)return;
  lpT=setTimeout(()=>{suppressClick=true;zoom(el.dataset.card);setTimeout(()=>suppressClick=false,600);},500);},{passive:true});
['touchend','touchmove','touchcancel'].forEach(t=>document.addEventListener(t,()=>clearTimeout(lpT),{passive:true}));
document.addEventListener('contextmenu',e=>{const el=e.target.closest('[data-card]');if(el&&el.dataset.card&&screen==='game'){e.preventDefault();zoom(el.dataset.card);}});

renderHome();
</script>
</body>
</html>
